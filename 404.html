<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada | SAKURA 64</title>
<style>
/* Cloudflare Pages sirve este archivo con estado 404 para cualquier ruta que no exista. */
:root{--bg:#F1F4F5;--surface:#FFFFFF;--ink:#1F1F1F;--muted:#2E2E2E;--line2:#E3E3E3;--accent:#E4007F;--on-accent:#FFFFFF;--focus:#2F6FB0;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141414;--surface:#1C1C1C;--ink:#ECECEC;--muted:#A3A3A3;--line2:#2C2C2C;--focus:#8FB0FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--surface:#1C1C1C;--ink:#ECECEC;--muted:#A3A3A3;--line2:#2C2C2C;--focus:#8FB0FF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:500 15px/1.7 'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;padding:16px}
main{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:28px 24px}
.kick{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:24px;line-height:1.2;margin:6px 0 10px}
p{margin:0 0 18px;color:var(--muted)}
a{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;padding:8px 16px;border-radius:2px}
a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<main>
<p class="kick">Error 404</p>
<h1>Esta página no existe</h1>
<p>Puede que el link esté mal escrito o que la página ya no esté. Tu tablero del método Harada te espera en el inicio.</p>
<a href="/">Ir a SAKURA 64</a>
</main>
</body>
</html>
