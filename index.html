<title>SAKURA 64: tablero gratis del método Harada para tus metas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout concept: slim top bar, home as a list of board cards, editor with the 9x9 map on the left and a sticky inspector on the right. Phones show one 3x3 block at a time. */
:root{
  --bg:#F1F4F5;--surface:#FFFFFF;--surface2:#F7F9F9;--ink:#1F1F1F;--muted:#2E2E2E;--line:#D6D6D6;--line2:#E3E3E3;
  --goal-bg:#FFFFFF;--goal-fg:#1F1F1F;--btn-bg:#282828;--btn-fg:#FFFFFF;--focus:#2F6FB0;--tint:16%;--ok:#2F7A4A;
  --p1:#D9282F;--p2:#F39800;--p3:#FFD400;--p4:#8CC63F;--p5:#00B5A5;--p6:#00A7E1;--p7:#2F5DCF;--p8:#E4007F;
  --f1:#FFFFFF;--f2:#282828;--f3:#282828;--f4:#282828;--f5:#282828;--f6:#282828;--f7:#FFFFFF;--f8:#FFFFFF;
  --accent:#E4007F;--on-accent:#FFFFFF;
  --grid-a:rgba(120,150,170,.10);--paper:#FDFDFA;
  --f-display:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  --f-body:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414;--surface:#1C1C1C;--surface2:#242424;--ink:#ECECEC;--muted:#A3A3A3;--line:#3A3A3A;--line2:#2C2C2C;
    --goal-bg:#1C1C1C;--goal-fg:#ECECEC;--btn-bg:#ECECEC;--btn-fg:#141414;--focus:#8FB0FF;--tint:26%;--ok:#6CC28C;--grid-a:rgba(255,255,255,.045);--paper:#1C1C1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414;--surface:#1C1C1C;--surface2:#242424;--ink:#ECECEC;--muted:#A3A3A3;--line:#3A3A3A;--line2:#2C2C2C;
  --goal-bg:#1C1C1C;--goal-fg:#ECECEC;--btn-bg:#ECECEC;--btn-fg:#141414;--focus:#8FB0FF;--tint:26%;--ok:#6CC28C;--grid-a:rgba(255,255,255,.045);--paper:#1C1C1C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 14px/1.7 var(--f-body);min-height:100%}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
.note{color:var(--muted);font-size:13px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line2)}
.barin{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;font:700 20px var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.brand.static{cursor:default}
.nav{display:flex;gap:4px;margin-left:12px;flex:1;min-width:0;flex-wrap:wrap}

.blk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:4px;border-radius:6px;background:var(--surface2);border:1px solid color-mix(in srgb,var(--pc) 32%,var(--line2))}
.blk.core{border:2px solid var(--ink)}
.board.single .blk{gap:6px;padding:8px}
.cell{aspect-ratio:1/1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;border-radius:4px;
  border:1px solid color-mix(in srgb,var(--pc) 40%,var(--surface));background:color-mix(in srgb,var(--pc) var(--tint),var(--surface));
  color:var(--ink);font:500 clamp(9.5px,1.05vw,12.5px)/1.22 var(--f-body);overflow:hidden;overflow-wrap:anywhere}
.cell>span.tx{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cell.solid{background:var(--pc);border-color:var(--pc);color:var(--pf,#fff);font-weight:700}
.cell.goal{background:var(--gc,var(--goal-bg));border:1.5px solid var(--gb,var(--ink));color:var(--gf,var(--goal-fg));font-family:var(--f-display);font-weight:700}
.cell.empty{background:transparent;border:1.5px dashed color-mix(in srgb,var(--pc) 55%,var(--surface));color:var(--muted)}
.cell.sel{outline:3px solid var(--focus);outline-offset:1px;z-index:2}
.board.single .cell{font-size:clamp(13px,3.4vw,16px);padding:10px;border-radius:6px}
.board.single .cell>span.tx{-webkit-line-clamp:6}
.mk{position:absolute;right:3px;bottom:3px;width:14px;height:14px;--pc:inherit}
.board.single .mk{width:18px;height:18px;right:6px;bottom:6px}
.mk.inline{position:static;width:16px;height:16px;flex:none}
.pri{position:absolute;left:3px;top:3px;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 5px;font-size:9px;font-weight:700;line-height:15px}
.board.single .pri{font-size:11px;line-height:18px;left:6px;top:6px}
.pri.p-media{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pri.p-baja{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.cell{cursor:text}
.cell textarea.ctx{display:block;width:100%;margin:0;padding:0;border:0;background:transparent;color:inherit;font:inherit;line-height:inherit;text-align:center;resize:none;outline:none;overflow:hidden}
.cell textarea.ctx::placeholder{color:var(--muted);opacity:.6;font-size:1.5em}
.cell textarea.ctx:focus::placeholder{opacity:0}
.cell:focus-within{outline:3px solid var(--focus);outline-offset:1px;z-index:3}
.copen{position:absolute;top:3px;right:3px;z-index:2;display:grid;place-items:center;width:24px;height:24px;padding:0;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);opacity:0;transition:opacity .12s}
.cell:hover .copen,.cell:focus-within .copen,.copen:focus-visible{opacity:1}
.board.single .copen{width:32px;height:32px;top:6px;right:6px}
.cell:focus-within textarea.ctx{padding-top:16px}
.board.single .cell:focus-within textarea.ctx{padding-top:30px}
.pri,.mk,.ntk{pointer-events:none}
.ntk{position:absolute;left:3px;bottom:3px;min-width:15px;height:15px;padding:0 4px;border-radius:5px;background:var(--pc);color:var(--pf,#fff);font-size:9px;font-weight:700;line-height:15px;text-align:center}
.board.single .ntk{min-width:18px;height:18px;line-height:18px;font-size:11px;left:6px;bottom:6px}

/* inspector */
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--pc)}
label,.lbl{font-weight:700;font-size:14px}
textarea,input[type="text"],input[type="date"],select{width:100%;font-size:16px;padding:9px 14px;border-radius:5px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);min-height:44px}
textarea{resize:vertical;line-height:1.4}
.field{position:relative;display:flex;flex-direction:column;gap:8px}
.field>label{line-height:20px}
.field:has(>label+input[type="text"]),.field:has(>label+input[type="date"]),.field:has(>label+select){padding-top:0}
.field:has(>label+input[type="text"])::after,.field:has(>label+input[type="date"])::after,.field:has(>label+select)::after{content:"";position:absolute;left:18px;top:23px;width:9px;height:9px;background:var(--surface);border-left:1px solid var(--ink);border-top:1px solid var(--ink);transform:rotate(45deg);pointer-events:none}
.arows{display:flex;flex-direction:column;gap:4px}
.arow{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:44px;padding:6px 10px;border-radius:5px;border:1px solid var(--line2);background:var(--bg);--pc:var(--ink)}
.arow .at{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .at.none{color:var(--muted)}
.arow .sq{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:5px;padding:8px 8px 8px 12px;background:var(--bg)}
.task .tm{flex:1;min-width:0}
.task .check{color:var(--pf);margin:-6px 0}
.task:has(.check){padding-left:2px}
.task.is-done .tm b{text-decoration:line-through;color:var(--muted)}
.task .tm b{display:block;overflow-wrap:anywhere}
.task .tm span{font-size:13px;color:var(--muted)}
.taskform{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line2);padding-top:12px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:44px;height:44px;border-radius:5px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.day[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.danger{color:var(--p4)}

/* today */
.today{max-width:820px}
.today h2{font-size:clamp(22px,3vw,30px)}
.tprog{display:flex;flex-direction:column;gap:8px;margin:10px 0 22px}
.bar2{height:10px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
.group{margin-bottom:18px}
.group h3{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:8px}
.trow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:4px 14px 4px 4px;margin-bottom:6px;--pc:var(--ink)}
.trow .tmain{flex:1;min-width:0;display:flex;flex-direction:column;padding-block:6px}
.trow .ttl{font-weight:700;overflow-wrap:anywhere}
.trow .tmeta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.trow.is-done .ttl{text-decoration:line-through;color:var(--muted)}
.streak{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.check{width:44px;height:44px;border:0;background:none;position:relative;flex:none}
.check::before{content:"";position:absolute;inset:8px;border:2px solid var(--pc);border-radius:5px;transition:background-color .15s}
.check svg{position:absolute;inset:12px;width:20px;height:20px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.check[aria-checked="true"]::before{background:var(--pc)}
.check[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.week{display:flex;gap:8px;align-items:flex-end;max-width:420px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-size:13px;color:var(--muted)}
.wkbar{width:100%;max-width:36px;height:64px;background:var(--line2);border-radius:4px;position:relative;overflow:hidden}
.wkbar i{position:absolute;left:0;right:0;bottom:0;background:var(--btn-bg);border-radius:4px}
.wk.now span{font-weight:700;color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:18px}
.empty-state{max-width:520px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* summary */
.sum{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.sum{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.prows{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;--pc:var(--ink)}
.plink{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;font-weight:700;padding:2px 0;min-height:36px}
.plink .pname{overflow-wrap:anywhere}
.pbar{position:relative;height:10px;border-radius:4px;background:var(--line2);overflow:hidden}
.pbar i{position:absolute;top:0;bottom:0;left:0}
.pbar .d{background:color-mix(in srgb,var(--pc) 38%,var(--surface))}
.pbar .w{background:var(--pc)}
.pnum{font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:13px;color:var(--muted)}
.export{display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* wizard */
.wiz{padding-block:24px 40px}
.sub-in{padding-block:22px 24px}
.sub.has-tabs .sub-in{padding-bottom:0}
.wiz-sub .lead{margin-bottom:0}
.wsteps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.wst{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:2px;border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:13px;background:var(--surface)}
.wst b{display:grid;place-items:center;width:22px;height:22px;border-radius:2px;border:1px solid var(--line);background:var(--surface2);font-size:12px}
.wst.cur{color:var(--ink);background:var(--surface);border-color:var(--ink);font-weight:700}
.wst.cur b{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wiz h1{font-size:clamp(22px,2.8vw,28px);letter-spacing:.02em;margin-bottom:8px}
.lead{color:var(--ink);font-size:15px;max-width:72ch;margin-bottom:20px}
.recall{background:var(--gc,var(--goal-bg));color:var(--gf,var(--goal-fg));border-radius:6px;padding:12px 16px;margin-bottom:18px;font-family:var(--f-display);font-weight:700;overflow-wrap:anywhere}
.rowin{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 18px;font-size:14px;color:var(--muted)}
.exchip{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:4px 10px;min-height:32px;font-size:13px;font-weight:500}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.wgrid{display:grid;grid-template-columns:minmax(280px,min(540px,calc(100vh - 290px))) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.wgrid{grid-template-columns:minmax(0,1fr);gap:22px}}
.wstage{width:100%;min-width:0}
@media (max-width:820px){.wstage{max-width:100%;min-width:0}.wgoal{max-width:100%;min-width:0;aspect-ratio:4/3}.wc textarea{padding:14% 4px 4px;font-size:12px}}
.wside{display:flex;flex-direction:column;gap:18px;min-width:0}
.wside .field{margin:0}
.lblrow{display:flex;align-items:center;gap:2px;margin-bottom:6px;font-weight:700}
.wgoal{aspect-ratio:1/1;width:100%;border-radius:6px;border:2px solid var(--gb,var(--ink));background:var(--gc,var(--goal-bg));color:var(--gf,var(--goal-fg));padding:20px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:none;transition:background .25s}
.wgoal-h{display:flex;align-items:center;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.wgoal-h .tipi{background:color-mix(in srgb,currentColor 18%,transparent);color:inherit}
.wgoal textarea{flex:1;width:100%;border:0;background:transparent;color:inherit;resize:none;text-align:center;font:700 clamp(20px,3.2vw,30px)/1.2 var(--f-display);padding:16% 4px 0;outline:none}
.wgoal textarea::placeholder{color:currentColor;opacity:.5}
.wgoal:focus-within{outline:3px solid var(--focus);outline-offset:3px}
.wgoal-n{align-self:flex-end;font-size:12px;opacity:.75}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;background:var(--sw);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw[aria-checked="true"]{box-shadow:0 0 0 3px var(--ink)}
.wside .examples{margin:0}
.wblk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;border-radius:6px;background:var(--surface2);border:2px solid var(--pc)}
.wc{position:relative;aspect-ratio:1/1;min-width:0;border-radius:6px;border:1.5px dashed color-mix(in srgb,var(--pc) 60%,var(--surface));background:var(--surface);display:flex;transition:background .2s,border-color .2s}
.wc:focus-within{outline:3px solid var(--focus);outline-offset:1px;z-index:2}
.wc textarea{flex:1;width:100%;min-width:0;border:0;background:transparent;resize:none;padding:22% 8px 6px;font:500 clamp(12px,1.45vw,15px)/1.25 var(--f-body);color:var(--ink);text-align:center;outline:none;overflow:hidden}
.wc textarea::placeholder{color:var(--muted);opacity:.75}
.wc.pill.filled{background:var(--pc);border:1.5px solid var(--pc)}
.wc.pill.filled textarea{color:var(--pf,#fff);font-weight:700}
.wc.act.filled{background:color-mix(in srgb,var(--pc) var(--tint),var(--surface));border-style:solid}
.wc.static{align-items:center;justify-content:center;text-align:center;padding:10px;border:0;font:700 clamp(12px,1.6vw,16px)/1.2 var(--f-display);overflow:hidden;overflow-wrap:anywhere}
.wc.static span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.wc.g{border:2px solid var(--gb,var(--ink));background:var(--gc,var(--goal-bg));color:var(--gf,var(--goal-fg))}
.wc.ps{background:var(--pc);color:var(--pf,#fff)}
.wcount{font-size:16px;display:flex;align-items:center;gap:4px}
.wcount b{font-family:var(--f-display);font-size:28px}
.whelp{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:14px;padding-left:18px;list-style:disc}
.tipi{position:relative;display:inline-grid;place-items:center;flex:none;width:20px;height:20px;margin-left:6px;border-radius:50%;background:var(--line2);color:var(--muted);font:700 12px/1 var(--f-body);cursor:help;text-transform:none;letter-spacing:0;vertical-align:middle}
.tipi::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(240px,70vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px 12px;border-radius:5px;font:500 13px/1.5 var(--f-body);text-align:left;pointer-events:none;z-index:30;display:none}
.tipi::before{content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:31;display:none}
.tipi:hover::after,.tipi:focus::after,.tipi:hover::before,.tipi:focus::before{display:block}


/* onboarding */
.onb{display:flex;flex-direction:column;padding-block:16px 40px;min-height:100vh}
.onb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.onb-body{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center;flex:1}
@media (min-width:860px){.onb-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}}
.stage-wrap{display:flex;justify-content:center}
.sc{border-radius:4px;background:var(--line2);transform:scale(.7);transition:background-color .5s ease,transform .5s ease}
.sc.lit{background:var(--c);transform:scale(1)}
.sc.win{background:var(--pc);transform:scale(1)}
.onb-copy{display:flex;flex-direction:column;gap:14px;max-width:520px}
.onb-x{min-height:84px}
.onb-btns{display:flex;flex-wrap:wrap;gap:8px}
.onb-page{min-height:100vh;border-bottom:0}
.stage{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:min(100%,460px);aspect-ratio:1/1;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:2px}
.onb-copy>p{font-size:15px;color:var(--ink)}
.onb-copy h1{font-size:clamp(24px,3.2vw,34px);letter-spacing:.02em}
.onb-steps{margin-bottom:4px}
@media (max-width:859px){
  .onb-body{grid-template-areas:"head" "stage" "copy";gap:20px}
  .onb-head{grid-area:head;display:flex;flex-direction:column;gap:6px}
  .onb-head h1{font-size:clamp(24px,3.2vw,34px);letter-spacing:.02em}
  .stage-wrap{grid-area:stage}
  .onb-copy{grid-area:copy}
  .ostep ol{list-style:none;margin:0 0 6px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .os{position:relative}
  .os::before{content:"";position:absolute;top:15px;left:calc(-50% + 18px);right:calc(50% + 18px);height:2px;background:var(--line)}
  .os:first-child::before{display:none}
  .os.done::before,.os.cur::before{background:var(--ink)}
  .os button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);text-align:center}
  .os button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
  .os b{position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;font-weight:700}
  .os.done b{border-color:var(--ink);background:var(--ink);color:var(--surface)}
  .os.done button{color:var(--ink)}
  .os.cur b{border-color:var(--accent);background:var(--accent);color:var(--on-accent);outline:4px solid color-mix(in srgb,var(--accent) 18%,transparent)}
  .os.cur button{color:var(--ink);font-weight:700}
  .ostep-n{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
  .onb-btns{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;column-gap:12px;row-gap:2px}
  .onb-btns:has(.ob-back){grid-template-columns:repeat(2,minmax(0,1fr))}
  .ob-cta{grid-column:-2;justify-content:center;text-align:center;min-height:48px;padding:8px 18px;font-size:17px;background:var(--surface);border:2px solid var(--accent);color:var(--ink);border-radius:2px;white-space:nowrap}
  .ob-cta:hover{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
  .ob-link{grid-column:-2;justify-self:center;font-weight:500}
  .onb-ex{margin-top:10px}
  .onb-skip{font-size:12px;font-weight:500;white-space:nowrap;min-height:28px}
  .ob-back{grid-row:1;justify-self:center}
}
@media (max-width:859px){
  .onb{padding-bottom:100px}
  .onb-btns{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(6px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
  .stage{width:min(100%,340px)}
  .onb-btns:has(.ob-back) .lg{display:none}
  .ob-cta{padding-inline:10px;font-size:clamp(14px,4.3vw,17px);min-width:0}
}
button.wst{font:inherit;font-size:13px;font-weight:500;cursor:pointer;min-height:34px}
button.wst.cur{font-weight:700}
.bubble.onb-goal p{font-weight:700;font-size:16px;line-height:1.5}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:3px 10px;font-size:13px;font-weight:500;color:var(--ink)}
.pchip i{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}
.eq span{border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:4px 12px}
.eq b{font-size:18px}
.sample{display:flex;flex-direction:column;gap:6px}
.sample div{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:8px 12px;font-size:14px}
.sample i{width:14px;height:14px;border-radius:2px;border:2px solid var(--pc);flex:none}
.sample span{margin-left:auto;color:var(--muted);font-size:12px}

<noscript><section class="wrap"><h1>SAKURA 64: tablero del método Harada</h1><p>Escribí una meta grande, dividila en 8 pilares y 64 acciones, convertí las acciones en tareas y exportá tu plan a PDF. Es gratis y tus datos no salen de tu navegador.</p><p>Para usar el tablero, activá JavaScript en tu navegador.</p><p><a href="https://uxuaria.com/blog/metodo-harada">Qué es el método Harada y cómo armar tu tablero</a></p></section></noscript>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdk=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dow=d=>(d.getDay()+6)%7;
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const fmtDate=s=>{const a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]};
const hash=n=>{let x=Math.imul(n+1,2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;return (x>>>0)%10000/10000};
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAYS1=['L','M','X','J','V','S','D'];
const DAYS_ONE=['Los lunes','Los martes','Los miércoles','Los jueves','Los viernes','Los sábados','Los domingos'];
const NEI=[[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0]];
const STATUS={sin:'Sin empezar',curso:'En curso',lograda:'Lograda'};
const PRI={alta:'Alta',media:'Media',baja:'Baja'};
const PHEX=['#D9282F','#F39800','#FFD400','#8CC63F','#00B5A5','#00A7E1','#2F5DCF','#E4007F'];
const PFG=['#FFFFFF','#282828','#282828','#282828','#282828','#282828','#FFFFFF','#FFFFFF'];
const pcv=k=>'var(--p'+(k+1)+')';
const pfv=k=>'var(--f'+(k+1)+')';

/* ---------- model ---------- */
function cellAt(r,c){
  const br=Math.floor(r/3),bc=Math.floor(c/3),lr=r%3,lc=c%3;
  if(br===1&&bc===1){
    if(lr===1&&lc===1)return {t:'goal'};
    return {t:'pillar',k:NEI.findIndex(p=>p[0]===lr&&p[1]===lc),ring:true};
  }
  const k=NEI.findIndex(p=>p[0]===br&&p[1]===bc);
  if(lr===1&&lc===1)return {t:'pillar',k:k,ring:false};
  return {t:'action',k:k,i:NEI.findIndex(p=>p[0]===lr&&p[1]===lc)};
}
function blankBoard(){
  return {id:uid(),example:false,goal:'',goalDate:'',goalColor:'',
    pillars:Array.from({length:8},()=>''),
    actions:Array.from({length:8},()=>Array.from({length:8},()=>({t:'',pri:'media',st:'sin'}))),
    tasks:[],created:Date.now()};
}
const EX={
  goal:'Tener una panadería de masa madre reconocida en mi ciudad en 3 años',
  pillars:['Producto de excelente calidad','Un local propio y cómodo','Clientes fieles','Marca reconocible','Ventas online y escala','Finanzas sanas','Equipo comprometido','Energía y bienestar propio'],
  actions:[
    ['Dominar 5 panes base con masa madre estable','Probar y documentar 20 recetas propias','Controlar temperatura y tiempos con una planilla','Elegir harinas de molinos locales','Hacer una cata semanal con clientes de confianza','Crear 2 panes de temporada por trimestre','Estandarizar pesos y porciones','Definir una receta insignia'],
    ['Definir el presupuesto del local','Visitar 10 locales con buena esquina','Negociar el contrato de alquiler','Conseguir habilitaciones y permisos','Comprar un horno profesional usado','Diseñar el espacio de mostrador y producción','Armar un ambiente cálido y limpio','Abrir con un evento para los vecinos'],
    ['Llegar a 100 clientes recurrentes','Lanzar una suscripción semanal de pan','Pedir una opinión a cada cliente nuevo','Responder mensajes en menos de una hora','Crear una tarjeta de sellos','Ofrecer pedidos anticipados por WhatsApp','Sumar 10 cafés y restaurantes como clientes','Medir cuántos clientes vuelven cada mes'],
    ['Definir nombre, voz y valores de la marca','Diseñar logo y packaging','Publicar 3 posts por semana','Filmar el proceso de amasado cada mes','Conseguir 5 notas en medios locales','Colaborar con 3 cafeterías de especialidad','Armar una web simple con pedidos','Participar en 2 ferias gastronómicas por año'],
    ['Vender por pedidos online con retiro','Ofrecer entrega en bicicleta en el barrio','Crear un taller de panadería de pago','Lanzar un kit de masa madre para el hogar','Hacer ventas mayoristas a restaurantes','Sumar un producto de alta rotación','Grabar un curso online','Medir qué producto deja más margen'],
    ['Registrar cada gasto e ingreso a diario','Calcular el costo real de cada pan','Definir precios con un margen del 40%','Separar la cuenta personal de la del negocio','Armar un fondo de reserva de 3 meses','Revisar los números cada domingo','Negociar mejores precios con proveedores','Planificar el flujo de caja a 6 meses'],
    ['Definir los roles de producción y atención','Contratar un ayudante de panadería','Escribir un manual de procesos paso a paso','Capacitar al equipo cada mes','Armar turnos justos y claros','Hacer una reunión semanal de 20 minutos','Dar feedback concreto cada 15 días','Premiar las metas del equipo con un bono'],
    ['Dormir 7 horas por noche','Caminar 30 minutos cada día','Tomar un día libre completo por semana','Hacer estiramientos antes de amasar','Hacer un chequeo médico al año','Meditar 10 minutos por la mañana','Leer 20 páginas antes de dormir','Tomar vacaciones una vez al año']
  ],
  tasks:[
    [0,2,'Anotar temperatura y tiempos de cada tanda','daily'],
    [0,4,'Probar una receta nueva con clientes','days',[5]],
    [2,3,'Responder consultas de clientes','weekdays'],
    [3,2,'Publicar un post del día','days',[0,2,4]],
    [3,3,'Filmar un video corto del amasado','days',[3]],
    [5,0,'Cargar ingresos y gastos del día','daily'],
    [5,5,'Revisar los números de la semana','days',[6]],
    [7,1,'Caminar 30 minutos','daily'],
    [7,5,'Meditar 10 minutos','weekdays'],
    [7,6,'Leer 20 páginas','daily'],
    [6,5,'Reunión de equipo de 20 minutos','days',[0]],
    [1,3,'Llamar a la oficina de habilitaciones','once'],
    [4,0,'Publicar el menú de pedidos online','once']
  ]
};
function buildExample(){
  const b=blankBoard();b.example=true;b.id='ejemplo';b.goal=EX.goal;
  const t0=today0();b.goalDate=dk(new Date(t0.getFullYear()+3,t0.getMonth(),t0.getDate()));
  EX.pillars.forEach((p,k)=>{
    b.pillars[k]=p;
    EX.actions[k].forEach((a,i)=>{
      const r=hash(k*8+i),r2=hash(k*8+i+77);
      b.actions[k][i]={t:a,pri:r<.22?'alta':r<.7?'media':'baja',st:r2<.2?'lograda':r2<.42?'curso':'sin'};
    });
  });
  const start=dk(addDays(t0,-21));
  EX.tasks.forEach((x,n)=>{
    const t={id:'ex'+n,k:x[0],i:x[1],title:x[2],freq:x[3],days:x[4]||[],done:{},start:start};
    if(t.freq!=='once'){
      for(let d=1;d<=14;d++){const dt=addDays(t0,-d);if(isDue(t,dt)&&hash(n*31+d)<.8)t.done[dk(dt)]=true;}
    }
    b.tasks.push(t);
  });
  return b;
}
function isDue(t,d){
  const key=dk(d);
  if(key<t.start)return false;
  if(t.freq==='once'){
    const ds=Object.keys(t.done).filter(k=>t.done[k]);
    return ds.length?ds.indexOf(key)>=0:key===dk(today0());
  }
  const w=dow(d);
  if(t.freq==='daily')return true;
  if(t.freq==='weekdays')return w<5;
  return (t.days||[]).indexOf(w)>=0;
}
function streak(t){
  if(t.freq==='once')return 0;
  let n=0;const t0=today0();
  for(let i=0;i<400;i++){
    const d=addDays(t0,-i);
    if(dk(d)<t.start)break;
    if(!isDue(t,d))continue;
    if(t.done[dk(d)])n++;else if(i===0)continue;else break;
  }
  return n;
}
function rate(t,n){
  const t0=today0();let due=0,done=0;
  for(let i=0;i<n;i++){
    const d=addDays(t0,-i),k=dk(d);
    if(!isDue(t,d))continue;
    if(t.done[k]){due++;done++;}else if(i>0)due++;
  }
  return {due:due,done:done};
}
function freqLabel(t){
  if(t.freq==='daily')return 'Todos los días';
  if(t.freq==='weekdays')return 'Lunes a viernes';
  if(t.freq==='once')return 'Una sola vez';
  const d=t.days||[];
  if(d.length===1)return DAYS_ONE[d[0]];
  return d.map(i=>DAYS[i]).join(', ');
}
function boardStats(b){
  let def=0,won=0;
  b.actions.forEach(r=>r.forEach(a=>{if(a.t.trim()){def++;if(a.st==='lograda')won++;}}));
  return {def:def,won:won,pdef:b.pillars.filter(p=>p.trim()).length};
}
function pillarStats(b,k){
  let def=0,won=0;
  b.actions[k].forEach(a=>{if(a.t.trim()){def++;if(a.st==='lograda')won++;}});
  return {def:def,won:won};
}
function countdown(ds){
  if(!ds)return 'Sin fecha meta. Ponerle fecha vuelve concreto al objetivo.';
  const n=Math.round((pdk(ds)-today0())/864e5);
  if(n>1)return 'Faltan '+n+' días.';
  if(n===1)return 'Falta 1 día.';
  if(n===0)return 'La fecha meta es hoy.';
  return 'La fecha meta pasó hace '+(-n)+' días.';
}
const getText=(b,s)=>s.t==='goal'?b.goal:s.t==='pillar'?b.pillars[s.k]:b.actions[s.k][s.i].t;
function setText(b,s,v){
  if(s.t==='goal')b.goal=v;else if(s.t==='pillar')b.pillars[s.k]=v;else b.actions[s.k][s.i].t=v;
}

/* ---------- state ---------- */
function load(){
  try{
    const raw=sessionStorage.getItem('harada-v1');
    if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.boards)&&o.boards.length)return o.boards;}
  }catch(e){}
  return [buildExample()];
}

try{seenOnb=sessionStorage.getItem('harada-seen')==='1';}catch(e){}
const S={boards:load(),view:seenOnb?'home':'onb',boardId:null,tab:'map',mode:'all',blockKey:'center',sel:null,
  draft:{title:'',freq:'daily',days:[0,2,4]},wiz:null,onb:0,showText:false};
let saveT=null,UNDO=null,toastT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{try{sessionStorage.setItem('harada-v1',JSON.stringify({boards:S.boards}));}catch(e){}},250);
}

const em=()=>narrow()?'block':S.mode;

/* Haikus originales (japonés 5-7-5 moras, español 5-7-5 sílabas) que se escriben solos en los subheaders. */
const HAIKUS=[
  ['いつまでも　全力尽くす　頑張って','Darlo todo hoy, / sin guardar nada adentro: / ¡gambatte, sigue!'],
  ['さくら咲く　小さな一歩　春を呼ぶ','El cerezo abre: / un paso chico llama / la primavera.'],
  ['富士の山　一歩ずつ行く　雲の上','Monte Fuji alto: / paso a paso se sube / sobre las nubes.'],
  ['雨だれも　続けば石に　穴をあく','Gota de lluvia: / si insiste, abre la piedra / día tras día.'],
  ['朝の茶に　今日の目標　書いておく','Té matutino: / anoto mi meta hoy / con calma y tinta.'],
  ['竹の子は　毎日少し　空へ伸ぶ','Brote de bambú: / cada día un poco más / camino al cielo.'],
  ['八本の　柱が守る　夢の門','Ocho pilares / cuidan la puerta abierta / hacia tu sueño.'],
  ['七たびの　転びのあとに　八度起く','Si caigo siete, / me levanto ocho veces: / así se avanza.'],
  ['月あかり　今日の一歩を　ほめておく','Luz de la luna: / celebra el paso de hoy / aunque sea chico.'],
  ['六十四　小さな道が　夢となる','Sesenta y cuatro / caminos pequeñitos / se vuelven sueño.']
];
const haikuHTML=()=>'<div class="haiku" aria-hidden="true"><span class="bub-av">'+logo(16)+'</span><div class="hk-b"><p class="hk-jp"></p><p class="hk-es"></p></div></div>';
const HK={i:Math.floor(Math.random()*HAIKUS.length),n:0,phase:'type',wait:0};
function haikuTick(){
  if(document.hidden)return;
  const els=app.querySelectorAll('.haiku');if(!els.length)return;
  const h=HAIKUS[HK.i],jp=[...h[0]],es=[...h[1]],total=jp.length+es.length;
  const calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(calm){HK.n=total;if(++HK.wait>160){HK.wait=0;HK.i=(HK.i+1)%HAIKUS.length;}}
  else if(HK.phase==='type'){HK.n+=HK.n<jp.length?1:2;if(HK.n>=total){HK.n=total;HK.phase='hold';HK.wait=0;}}
  else if(HK.phase==='hold'){if(++HK.wait>90)HK.phase='erase';}
  else{HK.n-=4;if(HK.n<=0){HK.n=0;HK.phase='type';HK.i=(HK.i+1)%HAIKUS.length;}}
  const a=Math.min(HK.n,jp.length),b=Math.max(0,HK.n-jp.length);
  els.forEach(el=>{
    const pj=el.querySelector('.hk-jp'),pe=el.querySelector('.hk-es');
    pj.textContent=jp.slice(0,a).join('');pe.textContent=es.slice(0,b).join('');
    pj.classList.toggle('caret',!calm&&HK.phase==='type'&&a<jp.length);
    pe.classList.toggle('caret',!calm&&(HK.phase!=='type'||a>=jp.length));
  });
}
setInterval(haikuTick,60);

  if(b.goalDate){const n=Math.round((pdk(b.goalDate)-today0())/864e5);

/* today */
function weekData(b){
  const t0=today0();let h='',tot=0,dn=0;
  for(let i=6;i>=0;i--){
    const d=addDays(t0,-i),k=dk(d),due=b.tasks.filter(t=>isDue(t,d)),done=due.filter(t=>t.done[k]).length;
    tot+=due.length;dn+=done;
    const pct=due.length?Math.round(done/due.length*100):0;
    h+='<div class="wk'+(i===0?' now':'')+'" title="'+DAYS[dow(d)]+' '+d.getDate()+': '+done+' de '+due.length+'"><div class="wkbar"><i style="height:'+pct+'%"></i></div><span>'+DAYS1[dow(d)]+'</span></div>';
  }
  return {html:'<div class="week" role="img" aria-label="Tareas cumplidas en los últimos 7 días">'+h+'</div>',pct:tot?Math.round(dn/tot*100):0,tot:tot};
}

function textSummary(b){
  const o=['SAKURA 64','Objetivo: '+b.goal];
  if(b.goalDate)o.push('Fecha meta: '+fmtDate(b.goalDate));
  o.push('');
  b.pillars.forEach((p,k)=>{
    if(!p.trim()&&!b.actions[k].some(a=>a.t.trim()))return;
    o.push('Pilar '+(k+1)+': '+(p.trim()||'(sin definir)'));
    b.actions[k].forEach((a,i)=>{
      if(!a.t.trim())return;
      o.push('  '+(i+1)+'. '+a.t+' ['+STATUS[a.st]+', prioridad '+PRI[a.pri].toLowerCase()+']');
      b.tasks.filter(t=>t.k===k&&t.i===i).forEach(t=>o.push('     - Tarea: '+t.title+' ('+freqLabel(t)+')'));
    });
    o.push('');
  });
  return o.join('\n');
}

/* ---------- render ---------- */
const app=document.getElementById('app');
function render(opts){
  opts=opts||{};
  const a=document.activeElement;
  const fid=a&&a.dataset?a.dataset.fid:null;
  let ss=null,se=null;
  if(fid&&typeof a.selectionStart==='number'){try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){}}
  app.style.minHeight=app.offsetHeight+'px';
  let html='';
  if(S.view==='onb')html=onbHTML();
  else{
    const b=cur();
    if(S.view==='board'&&!b)S.view='home';
    html=barHTML()+(S.view==='home'?homeHTML():S.view==='wiz'?wizHTML():S.view==='legal'?legalHTML():boardHTML(b))+footHTML();
  }
  app.innerHTML=html;
  fitCells();
  if(S.view==='onb'){S.onb=S.onb||0;updateOnb();}
  const chs=app.querySelector('.chips'),chp=chs&&chs.querySelector('[aria-pressed="true"]');
  if(chs&&chp&&chs.scrollWidth>chs.clientWidth)chs.scrollLeft=Math.max(0,chp.offsetLeft-chs.offsetLeft-16-(chs.clientWidth-chp.offsetWidth)/2+16);
  requestAnimationFrame(()=>{app.style.minHeight='';});
  if(opts.top)window.scrollTo(0,0);
  if(fid&&S.view!=='onb'){
    const n=app.querySelector('[data-fid="'+fid+'"]');
    if(n){n.focus({preventScroll:true});if(ss!=null&&n.setSelectionRange){try{n.setSelectionRange(ss,se);}catch(e){}}}
  }
  save();
}
function patch(){
  const b=cur();if(!b)return;
  const g=$('#gridWrap');if(g){g.innerHTML=gridHTML(b);fitCells();}
  const m=$('#bdMeta');if(m)m.innerHTML=metaHTML(b);
  const t=$('#bdTitle');if(t)t.textContent=b.goal||'Tablero sin título';
  save();
}
function toast(msg,undo){
  const el=document.getElementById('toast');
  clearTimeout(toastT);UNDO=undo||null;
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button class="btn sm" data-act="undo">Deshacer</button>':'');
  el.classList.add('show');
  toastT=setTimeout(()=>{el.classList.remove('show');UNDO=null;},7000);
}
function focusSoon(sel){setTimeout(()=>{const n=$(sel);if(n)n.focus();},30);}
function openBoard(id){

/* ---------- PDF ---------- */
const L=s=>String(s==null?'':s).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...').replace(/ /g,' ').replace(/[^ -ÿ]/g,'');
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(c,a)=>c.map(v=>Math.round(v*a+255*(1-a)));
function slug(s){return L(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'tablero';}
/* PDF de 3 páginas: tablero, tareas y resumen del avance. Encabezado con logo y pie con contacto en todas. */
const PDF_CONTACT={web:'uxuaria.com',webUrl:'https://uxuaria.com',mail:'info@uxuaria.com'};
const LEGAL_URL='https://sakura64.uxuaria.com'; /* las políticas están en el pie de la app */
function logoPNG(px){
  return new Promise(res=>{
    const c=PISTILS.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+p[2]+'" fill="#D9282F"/>').join('');
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+px+'" height="'+px+'" viewBox="0 0 80 80">'+c+'<path fill="#1F1F1F" d="'+JI.sakura+'"/></svg>';
    const img=new Image();
    img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=cv.height=px;cv.getContext('2d').drawImage(img,0,0,px,px);res(cv.toDataURL('image/png'));}catch(e){res(null);}};
    img.onerror=()=>res(null);
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function buildPDF(b,logo){
  const jsPDF=window.jspdf.jsPDF;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const PW=297,PH=210,M=12,TOTAL=3;
  const INK=[31,31,31],MUT=[94,94,94],LINE=[214,214,214],SOFT=[246,248,248],OK=[47,122,74];
  const st=boardStats(b),t0=today0();
  doc.setProperties({title:'SAKURA 64 - '+L(b.goal||'Tablero')});
  const cut=(txt,w)=>{const l=doc.splitTextToSize(txt,w);return l.length>1?l[0].replace(/.{0,3}$/,'...'):l[0]||'';};
  function header(title){
    if(logo)doc.addImage(logo,'PNG',M,7,9,9);
    doc.setTextColor.apply(doc,INK);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('SAKURA 64',M+(logo?11.5:0),13.6);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor.apply(doc,MUT);doc.text(L(title),PW-M,13.6,{align:'right'});
    doc.setDrawColor.apply(doc,INK);doc.setLineWidth(.35);doc.line(M,19,PW-M,19);
  }
  function footer(i){
    doc.setDrawColor.apply(doc,LINE);doc.setLineWidth(.3);doc.line(M,PH-12,PW-M,PH-12);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor.apply(doc,MUT);
    doc.textWithLink(PDF_CONTACT.web,M,PH-7,{url:PDF_CONTACT.webUrl});
    const w1=doc.getTextWidth(PDF_CONTACT.web);doc.text('·',M+w1+2.2,PH-7);
    doc.textWithLink(PDF_CONTACT.mail,M+w1+5,PH-7,{url:'mailto:'+PDF_CONTACT.mail});
    doc.text('Generado el '+fmtDate(dk(t0)),PW/2,PH-7,{align:'center'});
    doc.text('Página '+i+' de '+TOTAL,PW-M,PH-7,{align:'right'});
  }
  function fit(txt,w,h,font){
    doc.setFont('helvetica',font);
    for(let fs=6.8;fs>=4.2;fs-=0.4){
      doc.setFontSize(fs);const lines=doc.splitTextToSize(txt,w);
      if(txt.split(' ').every(wd=>doc.getTextWidth(wd)<=w)&&lines.length*fs*0.3528*1.16<=h)return {lines:lines,fs:fs};
    }
    doc.setFontSize(4.2);let lines=doc.splitTextToSize(txt,w);
    const max=Math.max(1,Math.floor(h/(4.2*0.3528*1.16)));lines=lines.slice(0,max);
    lines[lines.length-1]=lines[lines.length-1].replace(/.{0,3}$/,'...');
    return {lines:lines,fs:4.2};
  }
  /* página 1: tablero completo */
  header('Tablero completo');
  doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor.apply(doc,MUT);doc.text('MI OBJETIVO',M,26);
  doc.setFontSize(13);doc.setTextColor.apply(doc,INK);doc.text(cut(L(b.goal||'Tablero sin título'),PW-2*M),M,32.5);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor.apply(doc,MUT);
  doc.text(L((b.goalDate?'Fecha meta: '+fmtDate(b.goalDate)+'   ·   ':'')+st.def+' de 64 acciones definidas   ·   '+st.won+' logradas'),M,38);
  const cs=15.4,g=.7,bg=2.2,gx=M,gy=43,bs=3*cs+2*g+bg;
  const pos=(r,c)=>{const br=Math.floor(r/3),bc=Math.floor(c/3);return [gx+bc*bs+(c%3)*(cs+g),gy+br*bs+(r%3)*(cs+g)];};
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const x=cellAt(r,c),p=pos(r,c),X=p[0],Y=p[1];
    const col=x.t==='goal'?(b.goalColor?rgb(b.goalColor):INK):rgb(PHEX[x.k]);
    const txt=L(getText(b,x).trim());
    if(!txt){doc.setDrawColor.apply(doc,mixc(col,.4));doc.setLineWidth(.2);doc.setLineDashPattern([0.7,0.7],0);doc.roundedRect(X,Y,cs,cs,.6,.6,'S');doc.setLineDashPattern([],0);continue;}
    if(x.t==='action'){doc.setFillColor.apply(doc,mixc(col,.16));doc.setDrawColor.apply(doc,mixc(col,.4));doc.setLineWidth(.2);doc.roundedRect(X,Y,cs,cs,.6,.6,'FD');doc.setTextColor.apply(doc,INK);}
    else if(x.t==='goal'&&!b.goalColor){doc.setFillColor(255,255,255);doc.setDrawColor.apply(doc,INK);doc.setLineWidth(.45);doc.roundedRect(X,Y,cs,cs,.6,.6,'FD');doc.setTextColor.apply(doc,INK);}
    else{doc.setFillColor.apply(doc,col);doc.roundedRect(X,Y,cs,cs,.6,.6,'F');doc.setTextColor.apply(doc,x.t==='pillar'?rgb(PFG[x.k]):[255,255,255]);}
    const ft=fit(txt,cs-2,cs-2.6,x.t==='action'?'normal':'bold');
    doc.setFontSize(ft.fs);doc.setFont('helvetica',x.t==='action'?'normal':'bold');doc.setLineHeightFactor(1.16);

async function exportPDF(){
  const b=cur();if(!b)return;
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF. Recargá la página.');return;}
  try{
    const blob=buildPDF(b,await logoPNG(120));
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='sakura64-'+slug(b.goal)+'.pdf';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('PDF generado. Revisá tu carpeta de descargas.');
  }catch(e){
    toast('No se pudo generar el PDF. Probá de nuevo.');
  }
}

  if(dp&&dp.showPicker){try{dp.showPicker();}catch(x){}}
  const el=e.target.closest&&e.target.closest('[data-act]');
  if(!el){if(S.menu&&!e.target.closest('.mmenu')){S.menu=false;render();}return;}
  const f=A[el.dataset.act];
  if(S.menu&&el.dataset.act!=='menu')S.menu=false;
  if(f)f(el,e);
});
document.addEventListener('input',e=>{
  const el=e.target,bind=el.dataset&&el.dataset.bind;
  if(!bind)return;
  const b=cur();
  if(bind==='draftTitle'){S.draft.title=el.value;return;}
  if(!b)return;
  if(bind.indexOf('cell:')===0){const p=bind.split(':'),x=cellAt(+p[1],+p[2]);setText(b,x,el.value);cellLive(b,x,el);save();}
  else if(bind==='sel'){if(S.sel){setText(b,S.sel,el.value);wizSync(el);patch();}}
  else if(bind==='goalDate'){b.goalDate=el.value;const m=$('#bdMeta');if(m)m.innerHTML=metaHTML(b);const gc=$('#goal-count');if(gc)gc.textContent=countdown(b.goalDate);save();}
  else if(bind==='goal'){b.goal=el.value;wizSync(el);save();}
  else if(bind.indexOf('pillar:')===0){b.pillars[+bind.split(':')[1]]=el.value;wizSync(el);save();}
  else if(bind.indexOf('action:')===0){const p=bind.split(':');b.actions[+p[1]][+p[2]].t=el.value;wizSync(el);save();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.bind==='draftFreq'){S.draft.freq=el.value;render();}
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.dataset&&f.dataset.form==='sub'){
    e.preventDefault();
    const mail=$('#mc-mail'),ok=$('#mc-ok'),err=$('#mc-err');
    const v=(mail.value||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){err.textContent='Escribí un correo válido, por ejemplo nombre@correo.com.';mail.focus();return;}
    if(!ok.checked){err.textContent='Para suscribirte tenés que aceptar recibir el boletín.';ok.focus();return;}
    const btn=f.querySelector('[type="submit"]');
    if(btn.disabled)return;
    btn.disabled=true;btn.textContent='Enviando…';err.textContent='';
    subscribe(v).then(()=>{
      try{sessionStorage.setItem('harada-sub','1');}catch(x){}
      S.mascot='done';render();exportPDF();
      setTimeout(()=>{if(S.mascot==='done'){S.mascot='idle';render();}},5000);
    }).catch(()=>{
      btn.disabled=false;btn.textContent='Suscribirme y descargar';
      err.textContent='No pudimos conectar con el boletín. Revisá tu conexión e intentá de nuevo.';
    });
    return;
  }
  if(!f.dataset||f.dataset.form!=='task')return;
  e.preventDefault();
  const b=cur(),s=S.sel,d=S.draft;
  if(!b||!s||s.t!=='action')return;
  const title=d.title.trim();
  if(!title){toast('Escribí el nombre de la tarea.');focusSoon('#t-title');return;}
  if(d.freq==='days'&&!d.days.length){toast('Elegí al menos un día de la semana.');return;}
  b.tasks.push({id:uid(),k:s.k,i:s.i,title:title,freq:d.freq,days:d.freq==='days'?d.days.slice().sort():[],done:d.done?{[dk(today0())]:true}:{},start:dk(today0())});
  S.draft.title='';S.draft.done=false;render();focusSoon('#t-title');toast('Tarea agregada.');
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'&&S.menu){S.menu=false;render();const bb=$('[data-fid=burger]');if(bb)bb.focus();return;}
  if(e.key==='Escape'&&S.mascot==='form'){A['mascot-close']();return;}
  if(t.matches&&t.matches('textarea.ctx')){
    const w=t.parentNode,r=+w.dataset.r,c=+w.dataset.c;
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();const x=cellAt(r,c);openDet(x.t==='goal'?{t:'goal'}:x.t==='pillar'?{t:'pillar',k:x.k}:{t:'action',k:x.k,i:x.i});focusSoon('#d-text');return;}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();cellNext(r,c);return;}
    if(e.key==='Escape'){e.preventDefault();const o=w.querySelector('.copen');if(o)o.focus();return;}
    const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    if(d){
      if(e.key==='ArrowLeft'&&t.selectionStart>0)return;
      if(e.key==='ArrowRight'&&t.selectionEnd<t.value.length)return;
      const n=app.querySelector('.cell[data-r="'+(r+d[0])+'"][data-c="'+(c+d[1])+'"] textarea');
      if(n){e.preventDefault();n.focus();}
    }
    return;
  }
  if(e.key==='Enter'&&!e.shiftKey&&t.matches&&t.matches('.wiz textarea.wct, .det textarea.wct')){
    e.preventDefault();
    const list=Array.prototype.slice.call(app.querySelectorAll('.wiz textarea.wct, .det textarea.wct')).sort((x,y)=>x.id.localeCompare(y.id)),i=list.indexOf(t);
    const nx=list[i+1]||app.querySelector('[data-act^="wiz-n"],[data-act="wiz-finish"],#d-next');
    if(nx)nx.focus();
  }
});
window.addEventListener('popstate',e=>{
  if(S.view!=='board')return;
  const d=e.state&&e.state.b===S.boardId&&e.state.det;
  if(d)openDet(d,false);else{S.det=false;render({top:true});}
});
let wasNarrow=narrow(),rz=null;
let wasOnbMob=onbMob();
window.addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{if(S.view==='onb'){const m=onbMob();if(m!==wasOnbMob){wasOnbMob=m;render();}return;}const n=narrow();if(n!==wasNarrow){wasNarrow=n;if(S.view==='board'&&S.tab==='map')render();}else fitCells();},150);
});

render({top:false});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitCells);
})();
</script>
</body>
</html>
