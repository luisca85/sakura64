<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tablero Harada: partí un objetivo ambicioso en 8 pilares y 64 acciones, convertilas en tareas y exportá el resultado a PDF.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23fff'/%3E%3Cg%3E%3Crect x='1' y='1' width='6' height='6' rx='1.6' fill='%232B59D9'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.6' fill='%230A7F71'/%3E%3Crect x='17' y='1' width='6' height='6' rx='1.6' fill='%23A8650B'/%3E%3Crect x='17' y='9' width='6' height='6' rx='1.6' fill='%23C8365C'/%3E%3Crect x='17' y='17' width='6' height='6' rx='1.6' fill='%236842C9'/%3E%3Crect x='9' y='17' width='6' height='6' rx='1.6' fill='%235E7D12'/%3E%3Crect x='1' y='17' width='6' height='6' rx='1.6' fill='%23B04A2F'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.6' fill='%23526479'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.6' fill='%2314213B'/%3E%3C/g%3E%3C/svg%3E">
<title>Tablero Harada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout concept: slim top bar, home as a list of board cards, editor with the 9x9 map on the left and a sticky inspector on the right. Phones show one 3x3 block at a time. */
:root{
  --bg:#EBF0F5;--surface:#FFFFFF;--surface2:#F4F7FA;--ink:#14213B;--muted:#56657D;--line:#C9D3E0;--line2:#E0E7EF;
  --goal-bg:#14213B;--goal-fg:#FFFFFF;--btn-bg:#14213B;--btn-fg:#FFFFFF;--focus:#2B59D9;--tint:16%;--ok:#1F7A45;
  --p1:#2B59D9;--p2:#0A7F71;--p3:#A8650B;--p4:#C8365C;--p5:#6842C9;--p6:#5E7D12;--p7:#B04A2F;--p8:#526479;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1424;--surface:#152038;--surface2:#1A2745;--ink:#E7EDF7;--muted:#9AA9C2;--line:#30405F;--line2:#243352;
    --goal-bg:#E7EDF7;--goal-fg:#0C1424;--btn-bg:#E7EDF7;--btn-fg:#0C1424;--focus:#8FB0FF;--tint:26%;--ok:#5FD08E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1424;--surface:#152038;--surface2:#1A2745;--ink:#E7EDF7;--muted:#9AA9C2;--line:#30405F;--line2:#243352;
  --goal-bg:#E7EDF7;--goal-fg:#0C1424;--btn-bg:#E7EDF7;--btn-fg:#0C1424;--focus:#8FB0FF;--tint:26%;--ok:#5FD08E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);min-height:100%}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
.note{color:var(--muted);font-size:14px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line2)}
.barin{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;font:700 20px var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.brand.static{cursor:default}
.nav{display:flex;gap:4px;margin-left:12px;flex:1;min-width:0;flex-wrap:wrap}
.navbtn{background:none;border:0;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--muted);min-height:44px}
.navbtn.cur{color:var(--ink);background:var(--surface)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn.sm{width:36px;height:36px;border-radius:10px}
.iconbtn svg{width:20px;height:20px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:10px 16px;min-height:44px;font-weight:700;transition:transform .12s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;min-height:36px}
.link:hover{color:var(--ink)}

/* home */
.home{padding-block:36px 24px}
.hero{display:flex;flex-direction:column;gap:14px;max-width:660px;margin-bottom:32px}
.hero h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.02em}
.hero p{font-size:17px;color:var(--muted);max-width:56ch}
.hero .btn{align-self:flex-start;font-size:16px;padding:12px 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px}
.card{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:16px}
.card-body{display:flex;flex-direction:column;gap:10px;min-width:0;align-items:flex-start}
.card h2{font-size:19px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:14px}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--goal-bg);color:var(--goal-fg)}
.tip{margin-top:20px;color:var(--muted);max-width:70ch}
.mini{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;aspect-ratio:1/1;width:100%}
.mini i{border-radius:2px;background:var(--line2)}
.mini .m-goal{background:var(--goal-bg)}
.mini .m-solid{background:var(--pc)}
.mini .m-tint{background:color-mix(in srgb,var(--pc) 32%,var(--surface))}
.mini .m-win{background:var(--pc)}
.foot{padding-block:28px 48px;color:var(--muted);font-size:14px;max-width:80ch}

/* board header */
.bd{padding-block:20px 48px}
.bd-head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.bd-head h1{font-size:clamp(22px,3vw,32px);letter-spacing:-.01em;max-width:30ch;overflow-wrap:anywhere}
.bd-meta{display:flex;flex-wrap:wrap;gap:2px 18px;color:var(--muted);font-size:14px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.banner p{flex:1;min-width:220px;font-size:14px}
.tabsrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;border-bottom:1px solid var(--line2);padding-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-fg)}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1000px){.editor{grid-template-columns:minmax(0,1fr) 350px}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:44px;font-weight:700;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--btn-bg);color:var(--btn-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:210px;min-height:44px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip span.lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:#fff}
.cd{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 0 2px #fff6}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.board.single{grid-template-columns:minmax(0,1fr);max-width:560px;gap:0}
.blk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:4px;border-radius:13px;background:var(--surface2);border:1px solid color-mix(in srgb,var(--pc) 32%,var(--line2))}
.blk.core{border:2px solid var(--ink)}
.board.single .blk{gap:6px;padding:8px}
.cell{aspect-ratio:1/1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;border-radius:7px;
  border:1px solid color-mix(in srgb,var(--pc) 40%,var(--surface));background:color-mix(in srgb,var(--pc) var(--tint),var(--surface));
  color:var(--ink);font:500 clamp(9.5px,1.05vw,12.5px)/1.22 var(--f-body);overflow:hidden;overflow-wrap:anywhere}
.cell>span.tx{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cell.solid{background:var(--pc);border-color:var(--pc);color:#fff;font-weight:700}
.cell.goal{background:var(--goal-bg);border-color:var(--goal-bg);color:var(--goal-fg);font-family:var(--f-display);font-weight:700}
.cell.empty{background:transparent;border:1.5px dashed color-mix(in srgb,var(--pc) 55%,var(--surface));color:var(--muted)}
.cell.empty::after{content:"+";font-size:1.5em;line-height:1;opacity:.55}
.cell.sel{outline:3px solid var(--focus);outline-offset:1px;z-index:2}
.board.single .cell{font-size:clamp(13px,3.4vw,16px);padding:10px;border-radius:12px}
.board.single .cell>span.tx{-webkit-line-clamp:6}
.mk{position:absolute;right:3px;bottom:3px;width:14px;height:14px;--pc:inherit}
.board.single .mk{width:18px;height:18px;right:6px;bottom:6px}
.mk.inline{position:static;width:16px;height:16px;flex:none}
.pri{position:absolute;left:3px;top:3px;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 5px;font-size:9px;font-weight:700;line-height:15px}
.board.single .pri{font-size:11px;line-height:18px;left:6px;top:6px}
.hint{margin-top:12px;color:var(--muted);font-size:14px;max-width:70ch}

/* inspector */
.insp{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
@media (min-width:1000px){.insp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);overflow:auto}}
.insp h2{font-size:20px}
.insp h3{font-size:16px;margin-top:6px}
.insp-h{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--pc)}
label,.lbl{font-weight:700;font-size:14px}
textarea,input[type="text"],input[type="date"],select{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:44px}
textarea{resize:vertical;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px}
.arows{display:flex;flex-direction:column;gap:4px}
.arow{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);--pc:var(--ink)}
.arow .at{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .at.none{color:var(--muted)}
.arow .sq{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:8px 8px 8px 12px;background:var(--bg)}
.task .tm{flex:1;min-width:0}
.task .tm b{display:block;overflow-wrap:anywhere}
.task .tm span{font-size:13px;color:var(--muted)}
.taskform{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line2);padding-top:12px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.day[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.danger{color:var(--p4)}

/* today */
.today{max-width:820px}
.today h2{font-size:clamp(22px,3vw,30px)}
.tprog{display:flex;flex-direction:column;gap:8px;margin:10px 0 22px}
.bar2{height:10px;border-radius:6px;background:var(--line2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
.group{margin-bottom:18px}
.group h3{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:8px}
.trow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:4px 14px 4px 4px;margin-bottom:6px;--pc:var(--ink)}
.trow .tmain{flex:1;min-width:0;display:flex;flex-direction:column;padding-block:6px}
.trow .ttl{font-weight:700;overflow-wrap:anywhere}
.trow .tmeta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.trow.is-done .ttl{text-decoration:line-through;color:var(--muted)}
.streak{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.check{width:44px;height:44px;border:0;background:none;position:relative;flex:none}
.check::before{content:"";position:absolute;inset:8px;border:2px solid var(--pc);border-radius:9px;transition:background-color .15s}
.check svg{position:absolute;inset:12px;width:20px;height:20px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.check[aria-checked="true"]::before{background:var(--pc)}
.check[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.week{display:flex;gap:8px;align-items:flex-end;max-width:420px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-size:13px;color:var(--muted)}
.wkbar{width:100%;max-width:36px;height:64px;background:var(--line2);border-radius:7px;position:relative;overflow:hidden}
.wkbar i{position:absolute;left:0;right:0;bottom:0;background:var(--btn-bg);border-radius:7px}
.wk.now span{font-weight:700;color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:18px}
.empty-state{max-width:520px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* summary */
.sum{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.sum{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.prows{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;--pc:var(--ink)}
.plink{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;font-weight:700;padding:2px 0;min-height:36px}
.plink .pname{overflow-wrap:anywhere}
.pbar{position:relative;height:10px;border-radius:6px;background:var(--line2);overflow:hidden}
.pbar i{position:absolute;top:0;bottom:0;left:0}
.pbar .d{background:color-mix(in srgb,var(--pc) 38%,var(--surface))}
.pbar .w{background:var(--pc)}
.pnum{font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:13px;color:var(--muted)}
.export{display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* wizard */
.wiz{padding-block:28px 40px;max-width:760px}
.wsteps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.wst{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-weight:700;font-size:14px;background:var(--surface)}
.wst b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line2);font-size:13px}
.wst.cur{color:var(--btn-fg);background:var(--btn-bg);border-color:transparent}
.wst.cur b{background:var(--btn-fg);color:var(--btn-bg)}
.wiz h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.01em;margin-bottom:8px}
.lead{color:var(--muted);font-size:16px;max-width:60ch;margin-bottom:18px}
.recall{background:var(--goal-bg);color:var(--goal-fg);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-family:var(--f-display);font-weight:700;overflow-wrap:anywhere}
.rowin{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 18px;font-size:14px;color:var(--muted)}
.exchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

/* onboarding */
.onb{display:flex;flex-direction:column;padding-block:16px 40px;min-height:100vh}
.onb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.onb-body{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center;flex:1}
@media (min-width:860px){.onb-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}}
.stage-wrap{display:flex;justify-content:center}
.stage{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:min(100%,460px);aspect-ratio:1/1;padding:12px;background:var(--surface);border:1px solid var(--line2);border-radius:20px}
.sc{border-radius:4px;background:var(--line2);transform:scale(.7);transition:background-color .5s ease,transform .5s ease}
.sc.lit{background:var(--c);transform:scale(1)}
.sc.win{background:var(--pc);transform:scale(1)}
.onb-copy{display:flex;flex-direction:column;gap:14px;max-width:520px}
.onb-copy h1{font-size:clamp(30px,4.6vw,50px);letter-spacing:-.02em}
.onb-copy>p{font-size:17px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots button{width:44px;height:44px;border:0;background:none;position:relative}
.dots button::before{content:"";position:absolute;left:6px;right:6px;top:19px;height:6px;border-radius:3px;background:var(--line)}
.dots button[aria-current="step"]::before{background:var(--btn-bg)}
.onb-x{min-height:84px}
.ex{border-left:4px solid var(--ink);padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:18px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;background:var(--pc);color:#fff}
.eq{font-size:18px}
.eq b{font-family:var(--f-display);font-size:26px}
.sample{display:flex;flex-direction:column;gap:6px}
.sample div{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:15px}
.sample i{width:16px;height:16px;border-radius:5px;border:2px solid var(--pc);flex:none}
.sample span{margin-left:auto;color:var(--muted);font-size:13px}
.onb-btns{display:flex;flex-wrap:wrap;gap:8px}

/* toast */

}

  *{transition:none!important;animation:none!important}
}

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdk=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dow=d=>(d.getDay()+6)%7;
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const fmtDate=s=>{const a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]};
const hash=n=>{let x=Math.imul(n+1,2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;return (x>>>0)%10000/10000};
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAYS1=['L','M','X','J','V','S','D'];
const DAYS_ONE=['Los lunes','Los martes','Los miércoles','Los jueves','Los viernes','Los sábados','Los domingos'];
const NEI=[[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0]];
const STATUS={sin:'Sin empezar',curso:'En curso',lograda:'Lograda'};
const PRI={alta:'Alta',media:'Media',baja:'Baja'};
const PHEX=['#2B59D9','#0A7F71','#A8650B','#C8365C','#6842C9','#5E7D12','#B04A2F','#526479'];
const pcv=k=>'var(--p'+(k+1)+')';

/* ---------- model ---------- */
function cellAt(r,c){
  const br=Math.floor(r/3),bc=Math.floor(c/3),lr=r%3,lc=c%3;
  if(br===1&&bc===1){
    if(lr===1&&lc===1)return {t:'goal'};
    return {t:'pillar',k:NEI.findIndex(p=>p[0]===lr&&p[1]===lc),ring:true};
  }
  const k=NEI.findIndex(p=>p[0]===br&&p[1]===bc);
  if(lr===1&&lc===1)return {t:'pillar',k:k,ring:false};
  return {t:'action',k:k,i:NEI.findIndex(p=>p[0]===lr&&p[1]===lc)};
}
function blankBoard(){
  return {id:uid(),example:false,goal:'',goalDate:'',
    pillars:Array.from({length:8},()=>''),
    actions:Array.from({length:8},()=>Array.from({length:8},()=>({t:'',pri:'media',st:'sin'}))),
    tasks:[],created:Date.now()};
}
const EX={
  goal:'Tener una panadería de masa madre reconocida en mi ciudad en 3 años',
  pillars:['Producto de excelente calidad','Un local propio y cómodo','Clientes fieles','Marca reconocible','Ventas online y escala','Finanzas sanas','Equipo comprometido','Energía y bienestar propio'],
  actions:[
    ['Dominar 5 panes base con masa madre estable','Probar y documentar 20 recetas propias','Controlar temperatura y tiempos con una planilla','Elegir harinas de molinos locales','Hacer una cata semanal con clientes de confianza','Crear 2 panes de temporada por trimestre','Estandarizar pesos y porciones','Definir una receta insignia'],
    ['Definir el presupuesto del local','Visitar 10 locales con buena esquina','Negociar el contrato de alquiler','Conseguir habilitaciones y permisos','Comprar un horno profesional usado','Diseñar el espacio de mostrador y producción','Armar un ambiente cálido y limpio','Abrir con un evento para los vecinos'],
    ['Llegar a 100 clientes recurrentes','Lanzar una suscripción semanal de pan','Pedir una opinión a cada cliente nuevo','Responder mensajes en menos de una hora','Crear una tarjeta de sellos','Ofrecer pedidos anticipados por WhatsApp','Sumar 10 cafés y restaurantes como clientes','Medir cuántos clientes vuelven cada mes'],
    ['Definir nombre, voz y valores de la marca','Diseñar logo y packaging','Publicar 3 posts por semana','Filmar el proceso de amasado cada mes','Conseguir 5 notas en medios locales','Colaborar con 3 cafeterías de especialidad','Armar una web simple con pedidos','Participar en 2 ferias gastronómicas por año'],
    ['Vender por pedidos online con retiro','Ofrecer entrega en bicicleta en el barrio','Crear un taller de panadería de pago','Lanzar un kit de masa madre para el hogar','Hacer ventas mayoristas a restaurantes','Sumar un producto de alta rotación','Grabar un curso online','Medir qué producto deja más margen'],
    ['Registrar cada gasto e ingreso a diario','Calcular el costo real de cada pan','Definir precios con un margen del 40%','Separar la cuenta personal de la del negocio','Armar un fondo de reserva de 3 meses','Revisar los números cada domingo','Negociar mejores precios con proveedores','Planificar el flujo de caja a 6 meses'],
    ['Definir los roles de producción y atención','Contratar un ayudante de panadería','Escribir un manual de procesos paso a paso','Capacitar al equipo cada mes','Armar turnos justos y claros','Hacer una reunión semanal de 20 minutos','Dar feedback concreto cada 15 días','Premiar las metas del equipo con un bono'],
    ['Dormir 7 horas por noche','Caminar 30 minutos cada día','Tomar un día libre completo por semana','Hacer estiramientos antes de amasar','Hacer un chequeo médico al año','Meditar 10 minutos por la mañana','Leer 20 páginas antes de dormir','Tomar vacaciones una vez al año']
  ],
  tasks:[
    [0,2,'Anotar temperatura y tiempos de cada tanda','daily'],
    [0,4,'Probar una receta nueva con clientes','days',[5]],
    [2,3,'Responder consultas de clientes','weekdays'],
    [3,2,'Publicar un post del día','days',[0,2,4]],
    [3,3,'Filmar un video corto del amasado','days',[3]],
    [5,0,'Cargar ingresos y gastos del día','daily'],
    [5,5,'Revisar los números de la semana','days',[6]],
    [7,1,'Caminar 30 minutos','daily'],
    [7,5,'Meditar 10 minutos','weekdays'],
    [7,6,'Leer 20 páginas','daily'],
    [6,5,'Reunión de equipo de 20 minutos','days',[0]],
    [1,3,'Llamar a la oficina de habilitaciones','once'],
    [4,0,'Publicar el menú de pedidos online','once']
  ]
};
function buildExample(){
  const b=blankBoard();b.example=true;b.id='ejemplo';b.goal=EX.goal;
  const t0=today0();b.goalDate=dk(new Date(t0.getFullYear()+3,t0.getMonth(),t0.getDate()));
  EX.pillars.forEach((p,k)=>{
    b.pillars[k]=p;
    EX.actions[k].forEach((a,i)=>{
      const r=hash(k*8+i),r2=hash(k*8+i+77);
      b.actions[k][i]={t:a,pri:r<.22?'alta':r<.7?'media':'baja',st:r2<.2?'lograda':r2<.42?'curso':'sin'};
    });
  });
  const start=dk(addDays(t0,-21));
  EX.tasks.forEach((x,n)=>{
    const t={id:'ex'+n,k:x[0],i:x[1],title:x[2],freq:x[3],days:x[4]||[],done:{},start:start};
    if(t.freq!=='once'){
      for(let d=1;d<=14;d++){const dt=addDays(t0,-d);if(isDue(t,dt)&&hash(n*31+d)<.8)t.done[dk(dt)]=true;}
    }
    b.tasks.push(t);
  });
  return b;
}
function isDue(t,d){
  const key=dk(d);
  if(key<t.start)return false;
  if(t.freq==='once'){
    const ds=Object.keys(t.done).filter(k=>t.done[k]);
    return ds.length?ds.indexOf(key)>=0:key===dk(today0());
  }
  const w=dow(d);
  if(t.freq==='daily')return true;
  if(t.freq==='weekdays')return w<5;
  return (t.days||[]).indexOf(w)>=0;
}
function streak(t){
  if(t.freq==='once')return 0;
  let n=0;const t0=today0();
  for(let i=0;i<400;i++){
    const d=addDays(t0,-i);
    if(dk(d)<t.start)break;
    if(!isDue(t,d))continue;
    if(t.done[dk(d)])n++;else if(i===0)continue;else break;
  }
  return n;
}
function rate(t,n){
  const t0=today0();let due=0,done=0;
  for(let i=0;i<n;i++){
    const d=addDays(t0,-i),k=dk(d);
    if(!isDue(t,d))continue;
    if(t.done[k]){due++;done++;}else if(i>0)due++;
  }
  return {due:due,done:done};
}
function freqLabel(t){
  if(t.freq==='daily')return 'Todos los días';
  if(t.freq==='weekdays')return 'Lunes a viernes';
  if(t.freq==='once')return 'Una sola vez';
  const d=t.days||[];
  if(d.length===1)return DAYS_ONE[d[0]];
  return d.map(i=>DAYS[i]).join(', ');
}
function boardStats(b){
  let def=0,won=0;
  b.actions.forEach(r=>r.forEach(a=>{if(a.t.trim()){def++;if(a.st==='lograda')won++;}}));
  return {def:def,won:won,pdef:b.pillars.filter(p=>p.trim()).length};
}
function pillarStats(b,k){
  let def=0,won=0;
  b.actions[k].forEach(a=>{if(a.t.trim()){def++;if(a.st==='lograda')won++;}});
  return {def:def,won:won};
}
function countdown(ds){
  if(!ds)return 'Sin fecha meta. Ponerle fecha vuelve concreto al objetivo.';
  const n=Math.round((pdk(ds)-today0())/864e5);
  if(n>1)return 'Faltan '+n+' días.';
  if(n===1)return 'Falta 1 día.';
  if(n===0)return 'La fecha meta es hoy.';
  return 'La fecha meta pasó hace '+(-n)+' días.';
}
const getText=(b,s)=>s.t==='goal'?b.goal:s.t==='pillar'?b.pillars[s.k]:b.actions[s.k][s.i].t;
function setText(b,s,v){
  if(s.t==='goal')b.goal=v;else if(s.t==='pillar')b.pillars[s.k]=v;else b.actions[s.k][s.i].t=v;
}

/* ---------- state ---------- */
function load(){
  try{
    const raw=sessionStorage.getItem('harada-v1');
    if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.boards)&&o.boards.length)return o.boards;}
  }catch(e){}
  return [buildExample()];
}
let seenOnb=false;
try{seenOnb=sessionStorage.getItem('harada-seen')==='1';}catch(e){}
const S={boards:load(),view:seenOnb?'home':'onb',boardId:null,tab:'map',mode:'all',blockKey:'center',sel:null,
  draft:{title:'',freq:'daily',days:[0,2,4]},wiz:null,onb:0,showText:false};
let saveT=null,UNDO=null,toastT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{try{sessionStorage.setItem('harada-v1',JSON.stringify({boards:S.boards}));}catch(e){}},250);
}
function markSeen(){try{sessionStorage.setItem('harada-seen','1');}catch(e){}}
const cur=()=>S.boards.find(b=>b.id===S.boardId);
const narrow=()=>window.innerWidth<760;
const em=()=>narrow()?'block':S.mode;
const isDark=()=>{
  const t=document.documentElement.dataset.theme;
  if(t)return t==='dark';
  return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
};
function resetDraft(){S.draft={title:'',freq:'daily',days:[0,2,4]};}

/* ---------- html builders ---------- */
function logo(sz){
  let r='';
  NEI.forEach((p,k)=>{r+='<rect x="'+(p[1]*8+1)+'" y="'+(p[0]*8+1)+'" width="6" height="6" rx="1.6" fill="var(--p'+(k+1)+')"/>';});
  r+='<rect x="9" y="9" width="6" height="6" rx="1.6" fill="var(--ink)"/>';
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" aria-hidden="true">'+r+'</svg>';
}
function stIcon(st,inline){
  const c=inline?'mk inline':'mk';
  if(st==='lograda')return '<svg class="'+c+'" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--pc)"/><path d="M4.6 8.3l2.2 2.2 4.6-4.9" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(st==='curso')return '<svg class="'+c+'" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--pc)" stroke-width="1.6"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="var(--pc)"/></svg>';
  return inline?'<svg class="'+c+'" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="2.4 2"/></svg>':'';
}
function barHTML(){
  const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  return '<header class="bar"><div class="wrap barin">'+
    '<button class="brand" data-act="home" data-fid="brand" aria-label="Harada, ir al inicio">'+logo(28)+'<span>Harada</span></button>'+
    '<nav class="nav" aria-label="Navegación principal">'+
    '<button class="navbtn'+(S.view==='home'?' cur':'')+'" data-act="home" data-fid="nav-home"'+(S.view==='home'?' aria-current="page"':'')+'>Inicio</button>'+
    '<button class="navbtn" data-act="onb" data-fid="nav-how">Cómo funciona</button></nav>'+
    '<button class="iconbtn" data-act="theme" data-fid="theme" aria-label="Cambiar entre tema claro y oscuro">'+(isDark()?sun:moon)+'</button>'+
    '</div></header>';
}
function footHTML(){
  return '<footer class="wrap foot"><p>Prueba de concepto para lectores del boletín. Tus tableros viven en esta sesión del navegador y se borran al cerrar la pestaña. Exportá a PDF lo que quieras guardar.</p></footer>';
}
function miniHTML(b){
  let h='<div class="mini" aria-hidden="true">';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const x=cellAt(r,c);let cls='',st='';
    if(x.t==='goal'){if(b.goal.trim())cls='m-goal';}
    else if(x.t==='pillar'){if(b.pillars[x.k].trim()){cls='m-solid';st='--pc:'+pcv(x.k);}}
    else{const a=b.actions[x.k][x.i];if(a.t.trim()){cls=a.st==='lograda'?'m-win':'m-tint';st='--pc:'+pcv(x.k);}}
    h+='<i'+(cls?' class="'+cls+'"':'')+(st?' style="'+st+'"':'')+'></i>';
  }
  return h+'</div>';
}
function cardHTML(b){
  const s=boardStats(b),t0=today0(),key=dk(t0);
  const due=b.tasks.filter(t=>isDue(t,t0)),dn=due.filter(t=>t.done[key]).length;
  return '<article class="card"><div>'+miniHTML(b)+'</div><div class="card-body">'+
    (b.example?'<span class="tag">Ejemplo completo</span>':'')+
    '<h2>'+esc(b.goal||'Tablero sin título')+'</h2>'+
    '<div class="card-meta"><span>'+s.def+' de 64 acciones</span><span>'+s.won+' logradas</span><span>'+(due.length?dn+' de '+due.length+' tareas de hoy':'Sin tareas hoy')+'</span></div>'+
    '<div class="btnrow"><button class="btn primary" data-act="open" data-id="'+b.id+'" data-fid="open-'+b.id+'">Abrir</button>'+
    '<button class="btn" data-act="dup" data-id="'+b.id+'" data-fid="dup-'+b.id+'">'+(b.example?'Duplicar como mío':'Duplicar')+'</button>'+
    (b.example?'':'<button class="btn ghost" data-act="del" data-id="'+b.id+'" data-fid="del-'+b.id+'">Eliminar</button>')+
    '</div></div></article>';
}
function homeHTML(){
  return '<section class="wrap home"><div class="hero"><h1>Tableros Harada</h1>'+
    '<p>Partí un objetivo ambicioso en 8 pilares y 64 acciones. Después convertí cada acción en tareas que repetís.</p>'+
    '<button class="btn primary" data-act="new" data-fid="new">Nuevo tablero Harada</button></div>'+
    '<div class="cards">'+S.boards.map(cardHTML).join('')+'</div>'+
    '<p class="tip">Abrí el ejemplo para ver un tablero completo. En la pestaña Hoy podés marcar tareas y ver cómo se arma la racha.</p></section>';
}

/* board view */
function metaHTML(b){
  const s=boardStats(b);
  return '<span>'+s.def+' de 64 acciones definidas</span><span>'+s.won+' logradas</span><span>'+esc(countdown(b.goalDate))+'</span>';
}
function boardHTML(b){
  const tabs=[['map','Mapa'],['today','Hoy'],['sum','Resumen y PDF']];
  let body='';
  if(S.tab==='map')body=mapHTML(b);else if(S.tab==='today')body=todayHTML(b);else body=sumHTML(b);
  return '<section class="wrap bd"><div class="bd-head"><div><button class="link" data-act="home" data-fid="back">Volver al inicio</button></div>'+
    '<h1 id="bdTitle">'+esc(b.goal||'Tablero sin título')+'</h1><div class="bd-meta" id="bdMeta">'+metaHTML(b)+'</div></div>'+
    (b.example?'<div class="banner"><p>Este es un tablero de ejemplo con datos inventados. Editalo para explorar o duplicalo y empezá el tuyo.</p><button class="btn sm" data-act="dup" data-id="'+b.id+'" data-fid="dup-ex">Duplicar como mío</button></div>':'')+
    '<div class="tabsrow"><div class="tabs" role="tablist" aria-label="Secciones del tablero">'+
    tabs.map(t=>'<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-act="tab" data-v="'+t[0]+'" data-fid="tab-'+t[0]+'">'+t[1]+'</button>').join('')+
    '</div><button class="btn primary" data-act="export" data-fid="export-top">Exportar PDF</button></div>'+body+'</section>';
}
function toolbarHTML(b){
  let h='<div class="toolbar">';
  if(!narrow()){
    h+='<div class="seg" role="radiogroup" aria-label="Vista del tablero">'+
      '<button role="radio" aria-checked="'+(S.mode==='all')+'" data-act="mode" data-v="all" data-fid="m-all">Tablero completo</button>'+
      '<button role="radio" aria-checked="'+(S.mode==='block')+'" data-act="mode" data-v="block" data-fid="m-block">Un pilar a la vez</button></div>';
  }
  if(em()==='block'){
    h+='<div class="chips" role="group" aria-label="Elegir bloque">'+
      '<button class="chip" style="--pc:var(--ink)" aria-pressed="'+(S.blockKey==='center')+'" data-act="blockkey" data-v="center" data-fid="bk-center"><span class="cd" style="background:var(--ink)"></span><span class="lb">Objetivo</span></button>';
    for(let k=0;k<8;k++){
      h+='<button class="chip" style="--pc:'+pcv(k)+'" aria-pressed="'+(S.blockKey===k)+'" data-act="blockkey" data-v="'+k+'" data-fid="bk-'+k+'"><span class="cd"></span><span class="lb">'+esc(b.pillars[k].trim()||('Pilar '+(k+1)))+'</span></button>';
    }
    h+='</div>';
  }
  return h+'</div>';
}
function cellHTML(b,r,c){
  const x=cellAt(r,c);let txt='',cls='cell',label='',extra='';
  if(x.t==='goal'){txt=b.goal;cls+=' goal';label='Objetivo central';}
  else if(x.t==='pillar'){txt=b.pillars[x.k];cls+=' solid';label='Pilar '+(x.k+1);}
  else{const a=b.actions[x.k][x.i];txt=a.t;label='Pilar '+(x.k+1)+', acción '+(x.i+1);
    if(txt.trim()){extra=(a.pri==='alta'?'<span class="pri">Alta</span>':'')+stIcon(a.st,false);
      label+='. Prioridad '+PRI[a.pri].toLowerCase()+'. Estado '+STATUS[a.st].toLowerCase();}}
  const empty=!txt.trim();
  if(empty)cls=cls.replace(' solid','').replace(' goal','')+' empty';
  const s=S.sel;
  const on=s&&((s.t==='goal'&&x.t==='goal')||(s.t==='pillar'&&x.t==='pillar'&&s.k===x.k)||(s.t==='action'&&x.t==='action'&&s.k===x.k&&s.i===x.i));
  if(on)cls+=' sel';
  return '<button class="'+cls+'" style="--pc:'+(x.t==='goal'?'var(--ink)':pcv(x.k))+'" data-act="sel" data-r="'+r+'" data-c="'+c+'" data-fid="c-'+r+'-'+c+'" aria-pressed="'+(!!on)+'" aria-label="'+esc(label+': '+(empty?'vacía':txt))+'" title="'+esc(txt)+'">'+
    (empty?'':'<span class="tx">'+esc(txt)+'</span>')+extra+'</button>';
}
function blockHTML(b,br,bc){
  const core=br===1&&bc===1;
  const k=core?null:NEI.findIndex(p=>p[0]===br&&p[1]===bc);
  let h='<div class="blk'+(core?' core':'')+'" style="--pc:'+(core?'var(--ink)':pcv(k))+'">';
  for(let lr=0;lr<3;lr++)for(let lc=0;lc<3;lc++)h+=cellHTML(b,br*3+lr,bc*3+lc);
  return h+'</div>';
}
function gridHTML(b){
  if(em()==='block'){
    const p=S.blockKey==='center'?[1,1]:NEI[S.blockKey];
    return '<div class="board single">'+blockHTML(b,p[0],p[1])+'</div>';

/* today */
function weekData(b){
  const t0=today0();let h='',tot=0,dn=0;
  for(let i=6;i>=0;i--){
    const d=addDays(t0,-i),k=dk(d),due=b.tasks.filter(t=>isDue(t,d)),done=due.filter(t=>t.done[k]).length;
    tot+=due.length;dn+=done;
    const pct=due.length?Math.round(done/due.length*100):0;
    h+='<div class="wk'+(i===0?' now':'')+'" title="'+DAYS[dow(d)]+' '+d.getDate()+': '+done+' de '+due.length+'"><div class="wkbar"><i style="height:'+pct+'%"></i></div><span>'+DAYS1[dow(d)]+'</span></div>';
  }
  return {html:'<div class="week" role="img" aria-label="Tareas cumplidas en los últimos 7 días">'+h+'</div>',pct:tot?Math.round(dn/tot*100):0,tot:tot};
}
function todayHTML(b){
  if(!b.tasks.length){
    return '<div class="empty-state panel"><h2>Todavía no hay tareas</h2><p class="note">Abrí una acción del mapa y agregale la primera tarea. Acá van a aparecer las que te tocan cada día.</p><button class="btn primary" data-act="tab" data-v="map" data-fid="go-map">Ir al mapa</button></div>';
  }
  const t0=today0(),key=dk(t0),due=b.tasks.filter(t=>isDue(t,t0)),dn=due.filter(t=>t.done[key]).length;
  const label=t0.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  let groups='';
  for(let k=0;k<8;k++){
    const list=due.filter(t=>t.k===k);if(!list.length)continue;
    groups+='<div class="group"><h3><span class="dot" style="--pc:'+pcv(k)+'"></span>'+esc(b.pillars[k].trim()||'Pilar '+(k+1))+'</h3><ul>'+list.map(t=>{
      const done=!!t.done[key],n=streak(t),at=b.actions[t.k][t.i].t;
      return '<li class="trow'+(done?' is-done':'')+'" style="--pc:'+pcv(k)+'"><button class="check" role="checkbox" aria-checked="'+done+'" data-act="toggle" data-id="'+t.id+'" data-fid="chk-'+t.id+'" aria-label="'+esc(t.title)+'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>'+
        '<div class="tmain"><span class="ttl">'+esc(t.title)+'</span><span class="tmeta">'+esc(at)+', '+esc(freqLabel(t).toLowerCase())+'</span></div>'+
        (n>0?'<span class="streak">Racha de '+n+'</span>':'')+'</li>';}).join('')+'</ul></div>';
  }
  const wk=weekData(b);
  return '<div class="today"><h2 style="text-transform:capitalize">'+esc(label)+'</h2>'+
    '<div class="tprog"><p>'+(due.length?dn+' de '+due.length+' tareas cumplidas hoy':'Hoy no te toca ninguna tarea.')+'</p><div class="bar2" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+(due.length?Math.round(dn/due.length*100):0)+'"><i style="width:'+(due.length?dn/due.length*100:0)+'%"></i></div></div>'+
    groups+'<div class="panel" style="margin-top:22px"><h3 style="margin-bottom:12px">Últimos 7 días</h3>'+wk.html+'<p class="note" style="margin-top:10px">Cumplimiento de la semana: '+wk.pct+'%.</p></div></div>';
}

function textSummary(b){
  const o=['TABLERO HARADA','Objetivo: '+b.goal];
  if(b.goalDate)o.push('Fecha meta: '+fmtDate(b.goalDate));
  o.push('');
  b.pillars.forEach((p,k)=>{
    if(!p.trim()&&!b.actions[k].some(a=>a.t.trim()))return;
    o.push('Pilar '+(k+1)+': '+(p.trim()||'(sin definir)'));
    b.actions[k].forEach((a,i)=>{
      if(!a.t.trim())return;
      o.push('  '+(i+1)+'. '+a.t+' ['+STATUS[a.st]+', prioridad '+PRI[a.pri].toLowerCase()+']');
      b.tasks.filter(t=>t.k===k&&t.i===i).forEach(t=>o.push('     - Tarea: '+t.title+' ('+freqLabel(t)+')'));
    });
    o.push('');
  });
  return o.join('\n');
}

  const st=S.onb,stage=$('#stage');if(!stage)return;
  stage.querySelectorAll('.sc').forEach(el=>{
    const l=+el.dataset.l,lit=l<=Math.min(st,2),win=st===3&&el.dataset.w==='1';
    el.classList.toggle('lit',lit);el.classList.toggle('win',win);
    let d=0;
    if(win)d=+el.dataset.wo;else if(lit&&l===st&&st>0)d=+el.dataset.o;
    el.style.transitionDelay=d+'ms';
  });
  const s=ONB[st];
  $('#onb-h').textContent=s.h;$('#onb-p').textContent=s.p;$('#onb-x').innerHTML=s.x();
  $('#dots').innerHTML=ONB.map((x,i)=>'<button data-act="onb-go" data-v="'+i+'" data-fid="dot-'+i+'" aria-label="Paso '+(i+1)+' de 4"'+(i===st?' aria-current="step"':'')+'></button>').join('');
  let b='';
  if(st>0)b+='<button class="btn" data-act="onb-back" data-fid="ob-back">Atrás</button>';
  if(st<3)b+='<button class="btn primary" data-act="onb-next" data-fid="ob-next">Siguiente</button>';
  else b+='<button class="btn primary" data-act="onb-create" data-fid="ob-create">Crear mi tablero</button><button class="btn" data-act="onb-example" data-fid="ob-ex">Ver el ejemplo</button>';
  $('#onb-btns').innerHTML=b;
  const nx=$('#onb-btns .primary');if(nx&&st>0)nx.focus({preventScroll:true});
}

/* ---------- render ---------- */
const app=document.getElementById('app');
function render(opts){
  opts=opts||{};
  const a=document.activeElement;
  const fid=a&&a.dataset?a.dataset.fid:null;
  let ss=null,se=null;
  if(fid&&typeof a.selectionStart==='number'){try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){}}
  app.style.minHeight=app.offsetHeight+'px';
  let html='';
  if(S.view==='onb')html=onbHTML();
  else{
    const b=cur();
    if(S.view==='board'&&!b)S.view='home';
    html=barHTML()+(S.view==='home'?homeHTML():S.view==='wiz'?wizHTML():boardHTML(b))+footHTML();
  }
  app.innerHTML=html;
  if(S.view==='onb'){S.onb=S.onb||0;updateOnb();}
  requestAnimationFrame(()=>{app.style.minHeight='';});
  if(opts.top)window.scrollTo(0,0);
  if(fid&&S.view!=='onb'){
    const n=app.querySelector('[data-fid="'+fid+'"]');
    if(n){n.focus({preventScroll:true});if(ss!=null&&n.setSelectionRange){try{n.setSelectionRange(ss,se);}catch(e){}}}
  }
  save();
}
function patch(){
  const b=cur();if(!b)return;

  const m=$('#bdMeta');if(m)m.innerHTML=metaHTML(b);
  const t=$('#bdTitle');if(t)t.textContent=b.goal||'Tablero sin título';

function toast(msg,undo){
  const el=document.getElementById('toast');
  clearTimeout(toastT);UNDO=undo||null;
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button class="btn sm" data-act="undo">Deshacer</button>':'');
  el.classList.add('show');

}
function focusSoon(sel){setTimeout(()=>{const n=$(sel);if(n)n.focus();},30);}
function scrollInsp(){

/* ---------- PDF ---------- */
const L=s=>String(s==null?'':s).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...').replace(/ /g,' ').replace(/[^ -ÿ]/g,'');
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(c,a)=>c.map(v=>Math.round(v*a+255*(1-a)));
function slug(s){return L(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'tablero';}
function buildPDF(b){
  const jsPDF=window.jspdf.jsPDF;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const pages=[{w:297,h:210}];
  const INK=[20,33,59],MUT=[86,101,125];
  const cs=19.2,g=0.8,bg=2.4,gx=10,gy=13;
  const pos=(r,c)=>{const br=Math.floor(r/3),bc=Math.floor(c/3),lr=r%3,lc=c%3,bs=3*cs+2*g+bg;return [gx+bc*bs+lc*(cs+g),gy+br*bs+lr*(cs+g)];};
  function fit(txt,w,h,font){
    doc.setFont('helvetica',font);
    for(let fs=7.2;fs>=4.4;fs-=0.4){
      doc.setFontSize(fs);const lines=doc.splitTextToSize(txt,w);
      const wordsFit=txt.split(' ').every(wd=>doc.getTextWidth(wd)<=w);
      if(wordsFit&&lines.length*fs*0.3528*1.16<=h)return {lines:lines,fs:fs};
    }
    doc.setFontSize(4.4);let lines=doc.splitTextToSize(txt,w);
    const max=Math.max(1,Math.floor(h/(4.4*0.3528*1.16)));lines=lines.slice(0,max);
    lines[lines.length-1]=lines[lines.length-1].replace(/.{0,3}$/,'...');
    return {lines:lines,fs:4.4};
  }
  doc.setProperties({title:'Tablero Harada'});
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const x=cellAt(r,c),p=pos(r,c),X=p[0],Y=p[1];
    let txt='',kind=x.t,col=x.t==='goal'?INK:rgb(PHEX[x.k]);
    if(x.t==='goal')txt=b.goal;else if(x.t==='pillar')txt=b.pillars[x.k];else txt=b.actions[x.k][x.i].t;
    txt=L(txt.trim());
    if(!txt){
      doc.setDrawColor.apply(doc,mixc(col,.45));doc.setLineWidth(.25);doc.setLineDashPattern([0.8,0.8],0);
      doc.roundedRect(X,Y,cs,cs,1.2,1.2,'S');doc.setLineDashPattern([],0);continue;
    }
    if(kind==='action'){
      const f=mixc(col,.16);doc.setFillColor.apply(doc,f);doc.setDrawColor.apply(doc,mixc(col,.4));doc.setLineWidth(.2);
      doc.roundedRect(X,Y,cs,cs,1.2,1.2,'FD');doc.setTextColor.apply(doc,INK);
    }else{
      doc.setFillColor.apply(doc,col);doc.roundedRect(X,Y,cs,cs,1.2,1.2,'F');doc.setTextColor(255,255,255);
    }
    const ft=fit(txt,cs-2.4,cs-3,kind==='action'?'normal':'bold');
    doc.setFontSize(ft.fs);doc.setFont('helvetica',kind==='action'?'normal':'bold');doc.setLineHeightFactor(1.16);
    const lh=ft.fs*0.3528*1.16,y0=Y+(cs-ft.lines.length*lh)/2+ft.fs*0.3528*0.82;
    doc.text(ft.lines,X+cs/2,y0,{align:'center'});
    if(kind==='action'){
      const a=b.actions[x.k][x.i];
      doc.setDrawColor.apply(doc,col);doc.setLineWidth(.35);
      if(a.st==='lograda'){doc.line(X+cs-4.3,Y+cs-2.2,X+cs-3.4,Y+cs-1.3);doc.line(X+cs-3.4,Y+cs-1.3,X+cs-1.7,Y+cs-3.4);}
      else if(a.st==='curso'){doc.circle(X+cs-2.6,Y+cs-2.4,0.9,'S');}
      if(a.pri==='alta'){doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor.apply(doc,[200,54,92]);doc.text('!',X+1.1,Y+2.5);}
    }
  }
  const rx=gx+9*cs+6*g+2*bg+10,rw=297-10-rx;let ry=15;
  doc.setTextColor.apply(doc,MUT);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text('TABLERO HARADA',rx,ry);ry+=6;
  doc.setTextColor.apply(doc,INK);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setLineHeightFactor(1.2);
  const gl=doc.splitTextToSize(L(b.goal||'Sin titulo'),rw).slice(0,6);doc.text(gl,rx,ry);ry+=gl.length*5.4+2;
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor.apply(doc,MUT);
  if(b.goalDate){doc.text('Fecha meta: '+fmtDate(b.goalDate),rx,ry);ry+=5;}
  const st=boardStats(b);doc.text(st.def+' de 64 acciones definidas, '+st.won+' logradas',rx,ry);ry+=9;
  for(let k=0;k<8;k++){
    const ps=pillarStats(b,k);
    doc.setFillColor.apply(doc,rgb(PHEX[k]));doc.roundedRect(rx,ry-3,3.6,3.6,.8,.8,'F');
    doc.setTextColor.apply(doc,INK);doc.setFont('helvetica','bold');doc.setFontSize(8);
    const pl=doc.splitTextToSize(L(b.pillars[k].trim()||('Pilar '+(k+1))),rw-6).slice(0,2);
    doc.text(pl,rx+6,ry);ry+=pl.length*3.4;
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor.apply(doc,MUT);
    doc.text(ps.def+' de 8 definidas, '+ps.won+' logradas',rx+6,ry);ry+=6.2;
  }
  doc.setFontSize(7);doc.setTextColor.apply(doc,MUT);
  doc.text('Marcas: check = lograda, circulo = en curso, ! = prioridad alta',rx,196);
  /* detail pages */
  doc.addPage('a4','portrait');pages.push({w:210,h:297});
  let y=18;const M=15,CW=180;
  const ensure=h=>{if(y+h>284){doc.addPage('a4','portrait');pages.push({w:210,h:297});y=18;}};
  doc.setTextColor.apply(doc,INK);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Detalle por pilar',M,y);y+=9;
  for(let k=0;k<8;k++){
    const acts=b.actions[k].map((a,i)=>({a:a,i:i})).filter(o=>o.a.t.trim());
    if(!b.pillars[k].trim()&&!acts.length)continue;
    ensure(24);
    doc.setFillColor.apply(doc,rgb(PHEX[k]));doc.roundedRect(M,y,CW,8,1.5,1.5,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(10);
    let ph=L('Pilar '+(k+1)+': '+(b.pillars[k].trim()||'sin definir'));
    const pls=doc.splitTextToSize(ph,CW-6);if(pls.length>1)ph=pls[0].replace(/.{0,3}$/,'...');
    doc.text(ph,M+3,y+5.4);y+=12;
    if(!acts.length){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor.apply(doc,MUT);doc.text('Todavia no hay acciones en este pilar.',M+3,y);y+=8;}
    acts.forEach(o=>{
      const a=o.a,tl=b.tasks.filter(t=>t.k===k&&t.i===o.i);
      doc.setFont('helvetica','normal');doc.setFontSize(9.5);
      const lines=doc.splitTextToSize(L(a.t),118);
      ensure(lines.length*4.4+tl.length*4.2+3);
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor.apply(doc,rgb(PHEX[k]));doc.text(STATUS[a.st],M+3,y);
      doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor.apply(doc,INK);doc.text(lines,M+30,y);
      doc.setFontSize(8);doc.setTextColor.apply(doc,MUT);doc.text('Prioridad '+PRI[a.pri].toLowerCase(),M+CW-1,y,{align:'right'});
      y+=lines.length*4.4;
      tl.forEach(t=>{
        doc.setFontSize(8.5);doc.setTextColor.apply(doc,MUT);
        const tt=doc.splitTextToSize(L('- Tarea: '+t.title+' ('+freqLabel(t)+')'),130);
        ensure(tt.length*4);doc.text(tt,M+34,y);y+=tt.length*4;
      });
      y+=2.2;
    });
    y+=5;
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor.apply(doc,MUT);
    doc.text('Pagina '+i+' de '+n,pages[i-1].w-10,pages[i-1].h-6,{align:'right'});
  }
  return doc.output('blob');
}
async function exportPDF(){
  const b=cur();if(!b)return;
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF. Recargá la página.');return;}
  try{
    const blob=buildPDF(b);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='harada-'+slug(b.goal)+'.pdf';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('PDF generado. Revisá tu carpeta de descargas.');
  }catch(e){
    toast('No se pudo generar el PDF. Probá de nuevo.');
  }
}

/* ---------- actions ---------- */
const A={
  home(){S.view='home';render({top:true});},
  onb(){S.view='onb';S.onb=0;render({top:true});},
  'onb-next'(){S.onb=Math.min(3,S.onb+1);updateOnb();},
  'onb-back'(){S.onb=Math.max(0,S.onb-1);updateOnb();},
  'onb-go'(el){S.onb=+el.dataset.v;updateOnb();},
  'onb-skip'(){markSeen();S.view='home';render({top:true});},
  'onb-create'(){markSeen();A.new();},
  'onb-example'(){markSeen();openBoard('ejemplo');},
  theme(){const r=document.documentElement;r.dataset.theme=isDark()?'light':'dark';render();},
  new(){
    const b=blankBoard();S.boards.push(b);S.boardId=b.id;S.view='wiz';S.wiz={step:1,k:0};
    render({top:true});focusSoon('#w-goal');
  },
  open(el){openBoard(el.dataset.id);},
  dup(el){
    const src=S.boards.find(b=>b.id===el.dataset.id);if(!src)return;
    const c=JSON.parse(JSON.stringify(src));c.id=uid();c.example=false;c.created=Date.now();c.tasks.forEach(t=>{t.id=uid();});
    S.boards.push(c);
    if(S.view==='board'){openBoard(c.id);toast('Duplicado. Ahora estás editando tu copia.');}
    else{render();toast('Tablero duplicado.');}
  },
  del(el){
    const i=S.boards.findIndex(b=>b.id===el.dataset.id);if(i<0)return;
    const removed=S.boards.splice(i,1)[0];render();
    toast('Tablero eliminado.',()=>{S.boards.splice(i,0,removed);render();});
  },
  tab(el){S.tab=el.dataset.v;S.showText=false;render();},
  mode(el){S.mode=el.dataset.v;render();},
  blockkey(el){S.blockKey=el.dataset.v==='center'?'center':+el.dataset.v;S.sel=S.blockKey==='center'?{t:'goal'}:{t:'pillar',k:S.blockKey};resetDraft();render();},
  sel(el,e){
    const x=cellAt(+el.dataset.r,+el.dataset.c);
    S.sel=x.t==='goal'?{t:'goal'}:x.t==='pillar'?{t:'pillar',k:x.k}:{t:'action',k:x.k,i:x.i};
    resetDraft();render();
    if(e&&e.detail>0)scrollInsp();
  },
  selpillar(el){S.sel={t:'pillar',k:+el.dataset.k};resetDraft();render();},
  selaction(el){S.sel={t:'action',k:+el.dataset.k,i:+el.dataset.i};resetDraft();render();},
  openblock(el){S.mode='block';S.blockKey=+el.dataset.k;render();},
  gopillar(el){const k=+el.dataset.k;S.tab='map';S.mode='block';S.blockKey=k;S.sel={t:'pillar',k:k};resetDraft();render({top:true});},
  pri(el){const b=cur(),s=S.sel;if(b&&s&&s.t==='action'){b.actions[s.k][s.i].pri=el.dataset.v;render();}},
  st(el){const b=cur(),s=S.sel;if(b&&s&&s.t==='action'){b.actions[s.k][s.i].st=el.dataset.v;render();}},
  day(el){
    const n=+el.dataset.v,d=S.draft.days,i=d.indexOf(n);
    if(i>=0)d.splice(i,1);else d.push(n);
    render();
  },
  deltask(el){
    const b=cur();if(!b)return;
    const i=b.tasks.findIndex(t=>t.id===el.dataset.id);if(i<0)return;
    const removed=b.tasks.splice(i,1)[0];render();
    toast('Tarea eliminada.',()=>{b.tasks.splice(i,0,removed);render();});
  },
  toggle(el){
    const b=cur();if(!b)return;
    const t=b.tasks.find(x=>x.id===el.dataset.id);if(!t)return;
    const key=dk(today0());
    if(t.done[key])delete t.done[key];else t.done[key]=true;
    render();
  },
  clear(){
    const b=cur(),s=S.sel;if(!b||!s)return;
    const snap=JSON.stringify(b);
    if(s.t==='action'){const a=b.actions[s.k][s.i];a.t='';a.pri='media';a.st='sin';b.tasks=b.tasks.filter(t=>!(t.k===s.k&&t.i===s.i));}
    else if(s.t==='pillar')b.pillars[s.k]='';
    else b.goal='';
    render();
    toast(s.t==='pillar'?'Pilar vaciado.':'Casilla vaciada.',()=>{const i=S.boards.findIndex(x=>x.id===b.id);if(i>=0){S.boards[i]=JSON.parse(snap);render();}});
  },
  undo(){if(UNDO){const f=UNDO;UNDO=null;document.getElementById('toast').classList.remove('show');f();}},
  export(){exportPDF();},
  copysum(){
    const b=cur();if(!b)return;
    const txt=textSummary(b);
    const fallback=()=>{S.showText=true;render();const n=$('#sumtext');if(n){n.focus();n.select();}};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>toast('Resumen copiado.')).catch(fallback);
    }else fallback();
  },
  'wiz-ex'(el){const b=cur();b.goal=WIZ_EX[+el.dataset.v];const n=$('#w-goal');if(n)n.value=b.goal;wizSync();save();},
  'wiz-cancel'(){
    const i=S.boards.findIndex(b=>b.id===S.boardId);
    if(i>=0&&!S.boards[i].goal.trim())S.boards.splice(i,1);
    S.view='home';S.wiz=null;render({top:true});
  },
  'wiz-next'(){
    const b=cur();
    if(S.wiz.step===1&&!b.goal.trim())return;
    if(S.wiz.step===2){if(!b.pillars.some(p=>p.trim()))return;S.wiz.k=b.pillars.findIndex(p=>p.trim());}
    S.wiz.step++;render({top:true});focusSoon(S.wiz.step===2?'#w-p0':'#w-a0');
  },
  'wiz-back'(){
    const w=S.wiz,b=cur();
    if(w.step===3){
      const ks=[];b.pillars.forEach((p,k)=>{if(p.trim())ks.push(k);});
      const i=ks.indexOf(w.k);
      if(i>0){w.k=ks[i-1];render({top:true});focusSoon('#w-a0');return;}
    }
    w.step--;render({top:true});
  },
  'wiz-pillar'(el){S.wiz.k=+el.dataset.k;render();},
  'wiz-nextp'(){
    const b=cur(),w=S.wiz,ks=[];b.pillars.forEach((p,k)=>{if(p.trim())ks.push(k);});
    const i=ks.indexOf(w.k);if(i<ks.length-1)w.k=ks[i+1];
    render({top:true});focusSoon('#w-a0');
  },
  'wiz-finish'(){const id=S.boardId;S.wiz=null;openBoard(id);toast('Tablero creado. Elegí una acción para agregarle tareas.');}
};

document.addEventListener('change',e=>{

document.addEventListener('submit',e=>{
  const f=e.target;

document.addEventListener('keydown',e=>{
  const t=e.target;
  const cell=t.closest&&t.closest('.cell');
  if(cell&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key)>=0){
    e.preventDefault();
    let r=+cell.dataset.r,c=+cell.dataset.c;
    if(e.key==='ArrowUp')r--;else if(e.key==='ArrowDown')r++;else if(e.key==='ArrowLeft')c--;else c++;
    const n=app.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
    if(n){n.focus();n.click();}
    return;
  }
  if(e.key==='Enter'&&t.matches&&t.matches('.wiz input[type="text"]')){
    e.preventDefault();
    const list=Array.prototype.slice.call(app.querySelectorAll('.wiz input[type="text"]')),i=list.indexOf(t);
    const nx=list[i+1]||app.querySelector('[data-act^="wiz-n"],[data-act="wiz-finish"]');
    if(nx)nx.focus();
  }
});
let wasNarrow=narrow(),rz=null;
window.addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{const n=narrow();if(n!==wasNarrow){wasNarrow=n;if(S.view==='board'&&S.tab==='map')render();}},150);
});

render({top:false});
})();
</script>
